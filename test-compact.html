<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>10000 Vocabulary — 緊湊版測試</title>
<style>
html,body{margin:0;height:100%;background:#f4f7f6}iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="app" src="test.html?v=4" title="10000 Vocabulary 測試版"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d)return;

  const style=d.createElement('style');
  style.textContent=`
    .compact-meta{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;margin:10px 0 4px}
    .compact-meta .field{margin:0;min-width:110px}
    .compact-meta .label{margin-bottom:2px}
    @media(max-width:420px){.compact-meta{gap:16px}.compact-meta .field{min-width:95px}}
  `;
  d.head.appendChild(style);

  const page=d.getElementById('backPage');
  const difficulty=d.getElementById('backDifficulty');
  if(!page||!difficulty)return;

  const pageField=page.closest('.field');
  const difficultyField=difficulty.closest('.field');
  if(!pageField||!difficultyField)return;

  const row=d.createElement('div');
  row.className='compact-meta';
  pageField.parentNode.insertBefore(row,pageField);
  row.append(pageField,difficultyField);

  const pageLabel=pageField.querySelector('.label');
  if(pageLabel)pageLabel.textContent='頁碼';

  const updatePage=()=>{
    const text=page.textContent.trim();
    const match=text.match(/[0-9]+(?:[–-][0-9]+)?/);
    page.textContent=match?match[0]:'—';
  };

  const observer=new MutationObserver(updatePage);
  observer.observe(page,{childList:true,subtree:true,characterData:true});
  updatePage();
});
</script>
</body>
</html>
