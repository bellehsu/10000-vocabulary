<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>10000 Vocabulary 學習原型</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#17202a;background:#f4f7f6;line-height:1.5;--p:#0f766e;--p2:#e8f5f2;--line:#d6e2df;--bad:#a33d3d}*{box-sizing:border-box}body{margin:0;padding-bottom:74px}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:var(--p);color:#fff;padding:12px 16px}.topbar{max-width:980px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:20px;font-weight:850}.badge{background:#ffffff26;border-radius:999px;padding:5px 10px;font-size:12px}.wrap{max-width:980px;margin:auto;padding:16px}.panel,.face{background:#fff;border-radius:18px;box-shadow:0 4px 18px #0000000d}.panel{padding:16px;margin-bottom:14px}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.hero h1{margin:0 0 8px;font-size:31px}.muted{color:#63716d}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:var(--p2);border-radius:14px;padding:13px}.stat b{display:block;font-size:23px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,.small,.primary,.icon-btn{border-radius:10px;padding:9px 12px;font-weight:700}.btn,.primary{border:0;background:var(--p);color:#fff}.btn.secondary,.small,.icon-btn{border:1px solid #b9cbc6;background:#fff;color:#244b45}.btn.ghost{background:#eef8f5;color:#176b5d;border:1px solid #b9d8d1}.route-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.route-title h2{margin:0}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}.toolbar input,.toolbar select{width:100%;padding:10px;border:1px solid #ccd7d4;border-radius:10px;background:#fff}.word-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.word-item{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;display:flex;justify-content:space-between;gap:12px}.word-main{min-width:0}.word-en{font-size:21px;font-weight:850;color:var(--p);overflow-wrap:anywhere}.pos{font-size:13px;font-style:italic;color:#63716d}.word-zh{margin-top:4px}.meta{font-size:12px;color:#65736f;margin-top:7px}.word-actions{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}.review-on{background:#dff4ef;color:#0b665c;border-color:#8dc9bc}.hidden{display:none!important}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}.bottom a{text-decoration:none;color:#596a65;text-align:center;padding:10px 4px;font-size:13px}.bottom a.active{color:var(--p);font-weight:800;background:#f0f8f6}.question{font-size:23px;font-weight:800;margin:10px 0 18px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{border:1px solid #b9d0ca;background:#fff;border-radius:13px;padding:14px;text-align:left}.choice.correct{border-color:#2b8a6e;background:#e3f6ef}.choice.wrong{border-color:#bf5a5a;background:#fdeaea}.feedback{margin-top:14px;padding:14px;border-radius:13px;background:#eef5f3}.progress{height:8px;background:#dce8e5;border-radius:999px;overflow:hidden;margin-bottom:14px}.progress span{display:block;height:100%;background:var(--p)}
/* 上一輪單字卡版型 */
.card-filter{display:flex;gap:8px;flex-wrap:wrap}.card-filter select{padding:10px;border:1px solid #ccd7d4;border-radius:10px;background:#fff;min-width:160px}.card-wrap{perspective:1000px;min-height:520px}.flashcard{position:relative;min-height:500px;transition:.45s;transform-style:preserve-3d}.flashcard.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;padding:22px}.front{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.back{transform:rotateY(180deg);overflow:auto}.word-line{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.front-word{font-size:42px;font-weight:850;color:var(--p)}.speak{border:0;background:var(--p2);color:var(--p);border-radius:999px;width:42px;height:42px}.back-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #e4ecea;padding-bottom:10px}.back h2{margin:0;color:var(--p);font-size:30px}.field{margin:11px 0}.label{display:block;font-size:12px;font-weight:800;letter-spacing:.05em;color:#71817c;margin-bottom:2px}.example{font-size:17px}.example-zh{color:#566661;margin-top:3px}.memory{background:#eef8f5;border-radius:12px;padding:11px}.syn{color:#176b5d}.ant{color:#9a4242}.compact-meta{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-top:10px}.compact-meta .field{margin:0;min-width:110px}.stars{color:#b7791f;letter-spacing:1px}.card-nav{display:flex;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}
@media(max-width:820px){.hero{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}.word-list{grid-template-columns:1fr}.choices{grid-template-columns:1fr 1fr}}@media(max-width:560px){.wrap{padding:12px}.hero h1{font-size:27px}.stats{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.route-title{align-items:flex-start;flex-direction:column}.word-item{flex-direction:column}.word-actions{justify-content:flex-start}.front-word{font-size:34px}.face{padding:18px}.card-wrap{min-height:560px}.flashcard{min-height:540px}.compact-meta{gap:16px}.compact-meta .field{min-width:90px}.card-nav>*{flex:1 1 28%}.bottom a{font-size:12px}}
</style>
</head>
<body>
<header class="top"><div class="topbar"><div class="brand">10000 Vocabulary</div><div id="reviewBadge" class="badge">總複習 0</div></div></header>
<main id="app" class="wrap"><section class="panel">載入中…</section></main>
<nav class="bottom"><a href="#/" data-nav="home">首頁</a><a href="#/words" data-nav="words">單字</a><a href="#/practice" data-nav="practice">練習</a><a href="#/review" data-nav="review">總複習</a></nav>
<script>
'use strict';
const DATA='data/vocabulary-pages-12-15.csv?v=learning-prototype-2';
const app=document.querySelector('#app');let words=[],session=null,cardState={i:0,filtered:[]};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function csv(t){const rows=[];let r=[],v='',q=false;for(let i=0;i<t.length;i++){const c=t[i],n=t[i+1];if(c==='"'&&q&&n==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){r.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;r.push(v);if(r.some(x=>x!==''))rows.push(r);r=[];v=''}else v+=c}if(v||r.length){r.push(v);rows.push(r)}const h=rows.shift().map(x=>x.replace(/^\uFEFF/,'').trim());return rows.map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]??'').trim()]))) }
function normalize(r){return{word:r.word||'',part_of_speech:r.part_of_speech||'待確認',example:r.example||'',example_zh:r.example_zh||'',chinese:r.chinese||'',synonyms:r.synonyms||'',antonyms:r.antonyms||'',memory_hint:r.memory_hint||'',page:r.page||'',page_end:r.page_end||'',difficulty:r.difficulty||''}}
const pages=w=>[w.page].filter(Boolean),pageText=w=>w.page_end?`${w.page}–${w.page_end}`:w.page||'—';
function stars(n){const x=Math.max(0,Math.min(5,Number(n)||0));return `${'★'.repeat(x)}${'☆'.repeat(5-x)}（${x}/5）`}
function speak(word){if(!word)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-US';speechSynthesis.speak(u)}
function reviewSet(){return new Set(store.get('reviewWords',[]))}function saveReview(s){store.set('reviewWords',[...s]);updateBadge()}function updateBadge(){$('#reviewBadge').textContent=`總複習 ${reviewSet().size}`}
function toggleReview(word,rerender=true){const s=reviewSet();s.has(word)?s.delete(word):s.add(word);saveReview(s);if(rerender)route()}
function nav(active){$$('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===active))}
function home(){nav('home');const result=store.get('lastResult',null);app.innerHTML=`<section class="hero"><div class="panel"><h1>今天要練哪些單字？</h1><p class="muted">先看上一輪版型的單字卡，再完成第一次練習；稍後做第二次總複習。</p><div class="actions"><a href="#/cards"><button class="btn">開始第一輪單字卡</button></a><a href="#/practice"><button class="btn secondary">開始今日練習</button></a></div></div><div class="stats"><div class="stat"><span>單字總數</span><b>${words.length}</b></div><div class="stat"><span>總複習</span><b>${reviewSet().size}</b></div><div class="stat"><span>上次正確率</span><b>${result?result.rate+'%':'—'}</b></div></div></section><section class="panel"><h2>目前可測試路由</h2><p>#/、#/words、#/cards、#/practice、#/practice/result、#/review、#/review/result</p></section>`}
function wordsPage(){nav('words');const mode=store.get('wordMode','both');app.innerHTML=`<div class="route-title"><h2>單字列表</h2><span class="muted">中英文顯示可切換</span></div><section class="panel toolbar"><input id="q" placeholder="搜尋英文、中文或例句"><select id="page"><option value="">全部頁碼</option>${[...new Set(words.flatMap(pages))].sort((a,b)=>+a-+b).map(p=>`<option value="${p}">${p}</option>`).join('')}</select><select id="pos"><option value="">全部詞性</option>${[...new Set(words.map(w=>w.part_of_speech))].sort().map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('')}</select><select id="mode"><option value="both">中英並列</option><option value="en">只看英文</option><option value="zh">只看中文</option></select></section><div id="wordList" class="word-list"></div>`;$('#mode').value=mode;['q','page','pos','mode'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',()=>{if(id==='mode')store.set('wordMode',$('#mode').value);renderWords()}));renderWords()}
function renderWords(){const q=$('#q').value.trim().toLowerCase(),p=$('#page').value,pos=$('#pos').value,m=$('#mode').value,s=reviewSet();const list=words.filter(w=>(!q||[w.word,w.chinese,w.example,w.example_zh].join(' ').toLowerCase().includes(q))&&(!p||pages(w).includes(p))&&(!pos||w.part_of_speech===pos));$('#wordList').innerHTML=list.map(w=>`<article class="word-item"><div class="word-main"><div class="word-en ${m==='zh'?'hidden':''}">${esc(w.word)}</div><div class="pos">${esc(w.part_of_speech)}</div><div class="word-zh ${m==='en'?'hidden':''}">${esc(w.chinese||'—')}</div><div class="meta">頁碼 ${pageText(w)}｜難度 ${esc(w.difficulty)}/5</div>${m!=='both'?`<button class="icon-btn reveal" data-word="${esc(w.word)}">顯示${m==='en'?'中文':'英文'}</button>`:''}</div><div class="word-actions"><button class="icon-btn say" data-word="${esc(w.word)}">🔊</button><button class="icon-btn review ${s.has(w.word)?'review-on':''}" data-word="${esc(w.word)}">${s.has(w.word)?'✓ 已加入':'＋ 總複習'}</button></div></article>`).join('')||'<section class="panel">沒有符合條件的單字。</section>';$$('.say').forEach(b=>b.onclick=()=>speak(b.dataset.word));$$('.review').forEach(b=>b.onclick=()=>toggleReview(b.dataset.word));$$('.reveal').forEach(b=>b.onclick=()=>{const w=words.find(x=>x.word===b.dataset.word);b.textContent=m==='en'?(w?.chinese||'—'):(w?.word||'—')})}
function cards(){nav('words');cardState.filtered=words;cardState.i=Math.min(cardState.i,Math.max(0,words.length-1));app.innerHTML=`<div class="route-title"><h2>第一輪：單字卡</h2><span id="cardCount"></span></div><section class="panel card-filter"><select id="cardPage"><option value="">全部頁碼</option>${[...new Set(words.flatMap(pages))].sort((a,b)=>+a-+b).map(p=>`<option value="${p}">第 ${p} 頁</option>`).join('')}</select><button id="cardReview" class="small">＋ 加入總複習</button></section><div class="card-wrap"><div id="flashcard" class="flashcard"><article class="face front"><div class="word-line"><div id="frontWord" class="front-word"></div><button id="speakFront" class="speak">🔊</button></div><div id="frontPos" class="pos"></div><p class="meta">點卡片空白處翻面</p></article><article class="face back"><div class="back-head"><div><h2 id="backWord"></h2><div id="backPos" class="pos"></div></div><button id="speakBack" class="speak">🔊</button></div><div class="field"><span class="label">中文</span><div id="backZh"></div></div><div class="field"><span class="label">課本例句</span><div id="backExample" class="example"></div><div id="backExampleZh" class="example-zh"></div></div><div class="field"><span class="label">同義字</span><div id="backSyn" class="syn"></div></div><div class="field"><span class="label">反義字</span><div id="backAnt" class="ant"></div></div><div class="field memory"><span class="label">記憶提示</span><div id="backMemory"></div></div><div class="compact-meta"><div class="field"><span class="label">頁碼</span><div id="backPage"></div></div><div class="field"><span class="label">難度</span><div id="backDifficulty" class="stars"></div></div></div></article></div></div><div class="card-nav"><button id="prev" class="small">上一張</button><button id="flip" class="small">翻面</button><button id="next" class="primary">下一張</button></div>`;$('#cardPage').onchange=()=>{const p=$('#cardPage').value;cardState.filtered=words.filter(w=>!p||pages(w).includes(p));cardState.i=0;renderCard()};$('#prev').onclick=()=>moveCard(-1);$('#next').onclick=()=>moveCard(1);$('#flip').onclick=flipCard;$('#flashcard').onclick=e=>{if(!e.target.closest('button'))flipCard()};$('#speakFront').onclick=e=>{e.stopPropagation();speak(cardState.filtered[cardState.i]?.word)};$('#speakBack').onclick=e=>{e.stopPropagation();speak(cardState.filtered[cardState.i]?.word)};$('#cardReview').onclick=()=>{const w=cardState.filtered[cardState.i];if(w){toggleReview(w.word,false);renderCard()}};renderCard()}
function renderCard(){const w=cardState.filtered[cardState.i];$('#flashcard').classList.remove('flipped');if(!w){$('#frontWord').textContent='沒有符合條件的單字';$('#cardCount').textContent='0/0';return}$('#cardCount').textContent=`${cardState.i+1}/${cardState.filtered.length}`;$('#frontWord').textContent=$('#backWord').textContent=w.word;$('#frontPos').textContent=$('#backPos').textContent=w.part_of_speech;$('#backZh').textContent=w.chinese||'—';$('#backExample').textContent=w.example||'—';$('#backExampleZh').textContent=w.example_zh||'—';$('#backSyn').textContent=w.synonyms||'—';$('#backAnt').textContent=w.antonyms||'—';$('#backMemory').textContent=w.memory_hint||'—';$('#backPage').textContent=pageText(w);$('#backDifficulty').textContent=stars(w.difficulty);const on=reviewSet().has(w.word);$('#cardReview').textContent=on?'✓ 已加入總複習':'＋ 加入總複習';$('#cardReview').classList.toggle('review-on',on)}
function moveCard(n){if(!cardState.filtered.length)return;cardState.i=(cardState.i+n+cardState.filtered.length)%cardState.filtered.length;renderCard()}function flipCard(){if(cardState.filtered.length)$('#flashcard').classList.toggle('flipped')}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function makeQuestions(pool,count){return shuffle(pool).slice(0,Math.min(count,pool.length)).map((w,i)=>{const type=i%4;let prompt,answer,others;if(type===0){prompt=w.word;answer=w.chinese;others=words.filter(x=>x.word!==w.word).map(x=>x.chinese)}else if(type===1){prompt=w.chinese;answer=w.word;others=words.filter(x=>x.word!==w.word).map(x=>x.word)}else if(type===2){prompt=w.example.replace(new RegExp(w.word,'ig'),'________');answer=w.word;others=words.filter(x=>x.word!==w.word).map(x=>x.word)}else{prompt=`哪一個是「${w.chinese}」的正確單字？`;answer=w.word;others=words.filter(x=>x.part_of_speech===w.part_of_speech&&x.word!==w.word).map(x=>x.word)}return{w,type,prompt,answer,choices:shuffle([answer,...shuffle([...new Set(others)]).slice(0,3)])}})}
function startPractice(review=false){const pool=review?[...reviewSet()].map(x=>words.find(w=>w.word===x)).filter(Boolean):words;if(!pool.length){app.innerHTML=`<section class="panel"><h2>${review?'目前沒有總複習單字':'沒有可練習的單字'}</h2><a href="#/words"><button class="btn">前往單字列表</button></a></section>`;return}session={review,qs:makeQuestions(pool,review?pool.length:15),i:0,right:0,wrong:[],answered:false};renderQuestion()}
function renderQuestion(){nav(session.review?'review':'practice');const q=session.qs[session.i];if(!q){finish();return}app.innerHTML=`<div class="route-title"><h2>${session.review?'第二次總複習':'今日練習'}</h2><span>${session.i+1}/${session.qs.length}</span></div><div class="progress"><span style="width:${session.i/session.qs.length*100}%"></span></div><section class="panel"><div class="muted">${['英翻中','中翻英','例句選字','易混淆題'][q.type]}</div><div class="question">${esc(q.prompt)}</div><div class="choices">${q.choices.map(c=>`<button class="choice" data-choice="${esc(c)}">${esc(c)}</button>`).join('')}</div><div id="feedback"></div></section>`;$$('.choice').forEach(b=>b.onclick=()=>answer(b,q))}
function answer(btn,q){if(session.answered)return;session.answered=true;const ok=btn.dataset.choice===q.answer;$$('.choice').forEach(b=>{b.disabled=true;if(b.dataset.choice===q.answer)b.classList.add('correct')});if(ok)session.right++;else{btn.classList.add('wrong');session.wrong.push(q.w.word);const s=reviewSet();s.add(q.w.word);saveReview(s)}$('#feedback').innerHTML=`<div class="feedback"><b>${ok?'✅ 答對':'❌ 答錯'}</b><p>正確答案：${esc(q.answer)}</p><p>${esc(q.w.word)}｜${esc(q.w.part_of_speech)}｜${esc(q.w.chinese)}</p><p>${esc(q.w.example)}</p>${ok?`<button id="stillHard" class="btn ghost">仍不熟，加入總複習</button>`:'<span class="muted">已自動加入總複習</span>'}<button id="continue" class="btn">下一題</button></div>`;if($('#stillHard'))$('#stillHard').onclick=()=>{const s=reviewSet();s.add(q.w.word);saveReview(s);$('#stillHard').textContent='✓ 已加入'};$('#continue').onclick=()=>{session.i++;session.answered=false;renderQuestion()}}
function finish(){const result={review:session.review,total:session.qs.length,right:session.right,wrong:[...new Set(session.wrong)],rate:Math.round(session.right/session.qs.length*100)};store.set(session.review?'lastReviewResult':'lastResult',result);location.hash=session.review?'#/review/result':'#/practice/result'}
function resultPage(review){nav(review?'review':'practice');const r=store.get(review?'lastReviewResult':'lastResult',null);app.innerHTML=`<section class="panel"><h2>${review?'第二次總複習結果':'第一次練習結果'}</h2>${r?`<div class="stats"><div class="stat"><span>總題數</span><b>${r.total}</b></div><div class="stat"><span>答對</span><b>${r.right}</b></div><div class="stat"><span>正確率</span><b>${r.rate}%</b></div></div><p>需再複習：${r.wrong.length?r.wrong.map(esc).join('、'):'無'}</p>`:'<p>尚無結果。</p>'}<div class="actions"><a href="#/"><button class="btn secondary">回首頁</button></a><a href="#/review"><button class="btn">開始第二次總複習</button></a></div></section>`}
function route(){if(!words.length)return;const h=location.hash||'#/';if(h==='#/'||h==='#')home();else if(h.startsWith('#/words'))wordsPage();else if(h==='#/cards')cards();else if(h==='#/practice/result')resultPage(false);else if(h==='#/practice')startPractice(false);else if(h==='#/review/result')resultPage(true);else if(h==='#/review')startPractice(true);else home();updateBadge()}
window.addEventListener('hashchange',route);
fetch(DATA,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.text()}).then(t=>{words=csv(t).map(normalize).filter(w=>w.word);updateBadge();route()}).catch(err=>{app.innerHTML=`<section class="panel">資料載入失敗：${esc(err.message)}</section>`});
</script>
</body>
</html>
