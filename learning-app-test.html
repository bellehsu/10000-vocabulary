<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>10000 Vocabulary 學習原型</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#18312d;background:#f3f7f6;line-height:1.5;--p:#0f766e;--p2:#e5f4f1;--line:#d7e3df;--warn:#a33d3d}*{box-sizing:border-box}body{margin:0;padding-bottom:76px}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;background:var(--p);color:#fff;padding:12px 16px}.topbar{max-width:1080px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:850;font-size:20px}.badge{background:#ffffff26;border-radius:999px;padding:5px 10px;font-size:12px}.wrap{max-width:1080px;margin:auto;padding:18px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 6px 22px #0000000a;margin-bottom:14px}.hero{display:grid;grid-template-columns:1.4fr .8fr;gap:16px}.hero h1{margin:0 0 8px;font-size:32px}.muted{color:#64746f}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--p2);border-radius:14px;padding:14px}.stat b{display:block;font-size:24px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:750;background:var(--p);color:#fff}.btn.secondary{background:#fff;color:var(--p);border:1px solid #9ec7bf}.btn.ghost{background:#eef5f3;color:#315e57}.btn.danger{background:#fff;color:var(--warn);border:1px solid #e5b6b6}.actions{display:flex;gap:9px;flex-wrap:wrap}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:9px}.toolbar input,.toolbar select{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff}.word-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.word-item{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;display:flex;justify-content:space-between;gap:12px}.word-main{min-width:0}.word-en{font-size:21px;font-weight:850;color:var(--p);overflow-wrap:anywhere}.pos{font-size:13px;color:#6b7b76;font-style:italic}.word-zh{margin-top:5px}.meta{font-size:12px;color:#70807b;margin-top:7px}.icon-btn{border:1px solid #b8cec8;background:#fff;border-radius:10px;padding:8px 10px}.review-on{background:#dff4ef;color:#0b665c;border-color:#8dc9bc}.route-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.route-title h2{margin:0}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}.bottom a{text-decoration:none;color:#596a65;text-align:center;padding:10px 4px;font-size:13px}.bottom a.active{color:var(--p);font-weight:800;background:#f0f8f6}.question{font-size:23px;font-weight:800;margin:10px 0 18px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{border:1px solid #b9d0ca;background:#fff;border-radius:13px;padding:14px;text-align:left}.choice.correct{border-color:#2b8a6e;background:#e3f6ef}.choice.wrong{border-color:#bf5a5a;background:#fdeaea}.feedback{margin-top:14px;padding:14px;border-radius:13px;background:#eef5f3}.progress{height:8px;background:#dce8e5;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:var(--p)}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{background:#f7faf9;border-radius:12px;padding:12px}.label{font-size:12px;font-weight:800;color:#73827e}.flash{min-height:430px;display:flex;align-items:center;justify-content:center;text-align:center}.flash-word{font-size:44px;color:var(--p);font-weight:900}.hidden{display:none!important}@media(max-width:820px){.hero{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}.word-list{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}.choices{grid-template-columns:1fr 1fr}}@media(max-width:520px){.wrap{padding:12px}.top{padding:10px 12px}.hero h1{font-size:27px}.stats{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.word-item{align-items:flex-start}.actions .btn{flex:1 1 auto}.route-title{align-items:flex-start;flex-direction:column}.flash{min-height:360px}.flash-word{font-size:36px}.bottom a{font-size:12px}}
</style>
</head>
<body>
<header class="top"><div class="topbar"><div class="brand">10000 Vocabulary</div><div id="reviewBadge" class="badge">總複習 0</div></div></header>
<main id="app" class="wrap"></main>
<nav class="bottom"><a href="#/" data-nav="home">首頁</a><a href="#/words" data-nav="words">單字</a><a href="#/practice" data-nav="practice">練習</a><a href="#/review" data-nav="review">總複習</a></nav>
<script>
const DATA='data/vocabulary-pages-12-15.csv?v=learning-prototype-1';
const $=s=>document.querySelector(s),app=$('#app');let words=[],session=null;
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
function csv(t){const rows=[];let r=[],v='',q=false;for(let i=0;i<t.length;i++){const c=t[i],n=t[i+1];if(c==='"'&&q&&n==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){r.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;r.push(v);if(r.some(Boolean))rows.push(r);r=[];v=''}else v+=c}if(v||r.length){r.push(v);rows.push(r)}const h=rows.shift().map(x=>x.replace(/^\uFEFF/,'').trim());return rows.map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||'').trim()]))) }
const pages=w=>[w.page,w.page_end].filter(Boolean),pageText=w=>w.page_end?`${w.page}–${w.page_end}`:w.page||'—';
function reviewSet(){return new Set(store.get('reviewWords',[]))}function saveReview(s){store.set('reviewWords',[...s]);updateBadge()}function updateBadge(){$('#reviewBadge').textContent=`總複習 ${reviewSet().size}`}
function toggleReview(word){const s=reviewSet();s.has(word)?s.delete(word):s.add(word);saveReview(s);route()}
function speak(w){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';speechSynthesis.speak(u)}
function nav(active){document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===active))}
function home(){nav('home');const rev=reviewSet().size;const result=store.get('lastResult',null);app.innerHTML=`<section class="hero"><div class="card"><h1>今天要練哪些單字？</h1><p class="muted">先看單字卡，再完成第一次練習；稍後回來做第二次總複習。</p><div class="actions"><a href="#/cards"><button class="btn">開始第一輪單字卡</button></a><a href="#/practice"><button class="btn secondary">開始今日練習</button></a></div></div><div class="stats"><div class="stat"><span>單字總數</span><b>${words.length}</b></div><div class="stat"><span>總複習</span><b>${rev}</b></div><div class="stat"><span>上次正確率</span><b>${result?result.rate+'%':'—'}</b></div></div></section><section class="card"><h2>今日流程</h2><p>① 單字卡認識內容　② 四選一練習　③ 將答錯或不熟單字加入總複習　④ 稍後再做第二次總複習。</p></section>`}
function wordsPage(){nav('words');const mode=store.get('wordMode','both');app.innerHTML=`<div class="route-title"><h2>單字列表</h2><span class="muted">可切換中英文顯示</span></div><section class="card toolbar"><input id="q" placeholder="搜尋英文、中文或例句"><select id="page"><option value="">全部頁碼</option>${[...new Set(words.flatMap(pages))].sort((a,b)=>+a-+b).map(p=>`<option>${p}</option>`).join('')}</select><select id="pos"><option value="">全部詞性</option>${[...new Set(words.map(w=>w.part_of_speech))].sort().map(p=>`<option>${p}</option>`).join('')}</select><select id="mode"><option value="both">中英並列</option><option value="en">只看英文</option><option value="zh">只看中文</option></select></section><div id="list" class="word-list"></div>`;$('#mode').value=mode;['q','page','pos','mode'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',()=>{if(id==='mode')store.set('wordMode',$('#mode').value);renderWords()}));renderWords()}
function renderWords(){const q=$('#q').value.toLowerCase(),p=$('#page').value,pos=$('#pos').value,m=$('#mode').value,s=reviewSet();const list=words.filter(w=>(!q||[w.word,w.chinese,w.example,w.example_zh].join(' ').toLowerCase().includes(q))&&(!p||pages(w).includes(p))&&(!pos||w.part_of_speech===pos));$('#list').innerHTML=list.map(w=>`<article class="word-item"><div class="word-main"><div class="word-en ${m==='zh'?'hidden':''}">${w.word}</div><div class="pos">${w.part_of_speech}</div><div class="word-zh ${m==='en'?'hidden':''}">${w.chinese||'—'}</div><div class="meta">頁碼 ${pageText(w)}｜難度 ${w.difficulty}/5</div>${m!=='both'?`<button class="icon-btn reveal" data-word="${w.word}">顯示${m==='en'?'中文':'英文'}</button>`:''}</div><div><button class="icon-btn say" data-word="${w.word}">🔊</button><button class="icon-btn review ${s.has(w.word)?'review-on':''}" data-word="${w.word}">${s.has(w.word)?'✓':'＋'}</button></div></article>`).join('');document.querySelectorAll('.say').forEach(b=>b.onclick=()=>speak(b.dataset.word));document.querySelectorAll('.review').forEach(b=>b.onclick=()=>toggleReview(b.dataset.word));document.querySelectorAll('.reveal').forEach(b=>b.onclick=()=>{const w=words.find(x=>x.word===b.dataset.word);b.textContent=m==='en'?w.chinese:w.word})}
function cards(){nav('words');let i=0,back=false;const render=()=>{const w=words[i];app.innerHTML=`<div class="route-title"><h2>第一輪：單字卡</h2><span>${i+1}/${words.length}</span></div><section class="card flash" id="flash"><div>${back?`<div class="flash-word">${w.word}</div><p>${w.chinese}</p><p>${w.example}</p><p class="muted">${w.example_zh}</p><p>頁碼 ${pageText(w)}｜難度 ${w.difficulty}/5</p>`:`<div class="flash-word">${w.word}</div><div class="pos">${w.part_of_speech}</div><p class="muted">點卡片翻面</p>`}</div></section><div class="actions"><button id="prev" class="btn secondary">上一張</button><button id="review" class="btn ghost">加入總複習</button><button id="next" class="btn">下一張</button></div>`;$('#flash').onclick=()=>{back=!back;render()};$('#prev').onclick=()=>{i=(i-1+words.length)%words.length;back=false;render()};$('#next').onclick=()=>{i=(i+1)%words.length;back=false;render()};$('#review').onclick=()=>toggleReview(w.word)};render()}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function makeQuestions(pool,count=12){return shuffle(pool).slice(0,Math.min(count,pool.length)).map((w,i)=>{const type=i%3;let prompt,answer,others;if(type===0){prompt=w.word;answer=w.chinese;others=words.filter(x=>x.word!==w.word).map(x=>x.chinese)}else if(type===1){prompt=w.chinese;answer=w.word;others=words.filter(x=>x.word!==w.word).map(x=>x.word)}else{prompt=w.example.replace(new RegExp(w.word,'ig'),'________');answer=w.word;others=words.filter(x=>x.word!==w.word).map(x=>x.word)}return{w,type,prompt,answer,choices:shuffle([answer,...shuffle(others).slice(0,3)])}})}
function startPractice(review=false){const pool=review?[...reviewSet()].map(x=>words.find(w=>w.word===x)).filter(Boolean):words;session={review,qs:makeQuestions(pool,review?pool.length:15),i:0,right:0,wrong:[],answered:false};question()}
function question(){nav(session.review?'review':'practice');const q=session.qs[session.i];if(!q){finish();return}app.innerHTML=`<div class="route-title"><h2>${session.review?'第二次總複習':'今日練習'}</h2><span>${session.i+1}/${session.qs.length}</span></div><div class="progress"><span style="width:${session.i/session.qs.length*100}%"></span></div><section class="card"><div class="muted">${['英翻中','中翻英','例句選字'][q.type]}</div><div class="question">${q.prompt}</div><div class="choices">${q.choices.map(c=>`<button class="choice" data-choice="${c.replaceAll('"','&quot;')}">${c}</button>`).join('')}</div><div id="feedback"></div></section>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b,q))}
function answer(btn,q){if(session.answered)return;session.answered=true;const ok=btn.dataset.choice===q.answer;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.choice===q.answer)b.classList.add('correct')});if(!ok){btn.classList.add('wrong');session.wrong.push(q.w.word);const s=reviewSet();s.add(q.w.word);saveReview(s)}else session.right++;$('#feedback').innerHTML=`<div class="feedback"><b>${ok?'✅ 答對':'❌ 答錯'}</b><p>正確答案：${q.answer}</p><p>${q.w.word}｜${q.w.part_of_speech}｜${q.w.chinese}</p><p class="muted">${q.w.example}</p><div class="actions"><button id="again" class="btn ghost">仍不熟，加入總複習</button><button id="continue" class="btn">下一題</button></div></div>`;$('#again').onclick=()=>{const s=reviewSet();s.add(q.w.word);saveReview(s);$('#again').textContent='✓ 已加入'};$('#continue').onclick=()=>{session.i++;session.answered=false;question()}}
function finish(){const total=session.qs.length,rate=total?Math.round(session.right/total*100):0;store.set('lastResult',{right:session.right,total,rate});const isReview=session.review;if(isReview){const s=reviewSet();session.qs.forEach(q=>{if(!session.wrong.includes(q.w.word))s.delete(q.w.word)});saveReview(s)}location.hash=isReview?'#/review/result':'#/practice/result'}
function result(review=false){nav(review?'review':'practice');const r=store.get('lastResult',{right:0,total:0,rate:0}),remaining=reviewSet().size;app.innerHTML=`<section class="card"><h2>${review?'第二次總複習完成':'第一次練習完成'}</h2><div class="stats"><div class="stat"><span>答對</span><b>${r.right}</b></div><div class="stat"><span>總題數</span><b>${r.total}</b></div><div class="stat"><span>正確率</span><b>${r.rate}%</b></div></div><p>目前總複習清單還有 <b>${remaining}</b> 個單字。</p><div class="actions"><a href="${review?'#/':'#/review'}"><button class="btn">${review?'返回首頁':'開始第二次總複習'}</button></a><a href="#/words"><button class="btn secondary">查看單字</button></a></div></section>`}
function reviewPage(){nav('review');const n=reviewSet().size;if(!n){app.innerHTML=`<section class="card"><h2>第二次總複習</h2><p>目前沒有待複習單字。你可以在單字列表手動加入，或完成第一次練習後由系統自動加入答錯單字。</p><a href="#/words"><button class="btn">前往單字列表</button></a></section>`;return}app.innerHTML=`<section class="card"><h2>第二次總複習</h2><p>共有 <b>${n}</b> 個單字。題型會重新安排，答錯的單字會繼續保留。</p><button id="start" class="btn">開始總複習</button></section>`;$('#start').onclick=()=>startPractice(true)}
function route(){const h=location.hash||'#/';if(h==='#/'||h==='#')home();else if(h==='#/words')wordsPage();else if(h==='#/cards')cards();else if(h==='#/practice')startPractice(false);else if(h==='#/practice/result')result(false);else if(h==='#/review')reviewPage();else if(h==='#/review/result')result(true);else home();updateBadge()}
window.addEventListener('hashchange',route);fetch(DATA,{cache:'no-store'}).then(r=>r.text()).then(t=>{words=csv(t);route()}).catch(e=>app.innerHTML=`<div class="card">資料載入失敗：${e.message}</div>`);
</script>
</body></html>
