name: Fix pages 65-70 CSV quoting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix evaluation row quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('data/pages-061-070.csv')
          s = p.read_text(encoding='utf-8')
          old = 'evaluation,noun,The evaluation is unjust, so we cannot accept it.,這件評估是不公平的，所以我們不能接受。'
          new = 'evaluation,noun,"The evaluation is unjust, so we cannot accept it.",這件評估是不公平的，所以我們不能接受。'
          if old in s:
              p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fix if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/pages-061-070.csv
          git commit -m "Fix CSV quoting for pages 65-70"
          git push
