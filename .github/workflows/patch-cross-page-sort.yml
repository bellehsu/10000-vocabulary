name: Patch cross-page primary sorting

on:
  push:
    branches: ["fix-cross-page-primary-sort"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-cross-page-primary-sort
      - name: Make cross-page words belong to their first page for filtering and ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          old = "const pages=w=>[w.page,w.page_end].filter(Boolean),pageText="
          new = "const pages=w=>[w.page].filter(Boolean),pageText="
          for name in ("index.html", "learning-app-test.html"):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"target text not found in {name}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path('.github/workflows/patch-cross-page-sort.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html learning-app-test.html .github/workflows/patch-cross-page-sort.yml
          git commit -m "修正跨頁單字以起始頁排序"
          git push origin HEAD:fix-cross-page-primary-sort
