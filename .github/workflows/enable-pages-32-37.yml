name: Enable vocabulary pages through 37

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update index data loader
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          old_data = "const DATA='data/vocabulary-pages-12-15.csv?v=20260807b';"
          new_data = "const DATA=['data/vocabulary-pages-12-15.csv?v=20260810','data/vocabulary-pages-24-31.csv?v=20260810','data/vocabulary-pages-32-37.csv?v=20260810'];"

          old_loader = "window.addEventListener('hashchange',route);fetch(DATA,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.text()}).then(t=>{words=parseCsv(t).map(normalize).filter(w=>w.word);updateBadge();route()}).catch(err=>{app.innerHTML=`<section class=\"panel\">資料載入失敗：${esc(err.message)}</section>`});"
          new_loader = "window.addEventListener('hashchange',route);Promise.all(DATA.map(url=>fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`${url}: HTTP ${r.status}`);return r.text()}))).then(parts=>{const seen=new Set();words=parts.flatMap(t=>parseCsv(t).map(normalize)).filter(w=>{if(!w.word)return false;const key=`${w.word}|${w.page}`;if(seen.has(key))return false;seen.add(key);return true});updateBadge();route()}).catch(err=>{app.innerHTML=`<section class=\"panel\">資料載入失敗：${esc(err.message)}</section>`});"

          if old_data in text:
              text = text.replace(old_data, new_data)
          elif new_data not in text:
              raise SystemExit("DATA declaration not found")

          if old_loader in text:
              text = text.replace(old_loader, new_loader)
          elif new_loader not in text:
              raise SystemExit("data loader block not found")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: enable vocabulary pages through 37"
          git push
