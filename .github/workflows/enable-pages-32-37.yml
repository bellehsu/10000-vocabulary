name: Rebuild vocabulary data

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/enable-pages-32-37.yml"
      - "scripts/rebuild_data.py"
      - "app.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild canonical CSVs and indexes
        run: python3 scripts/rebuild_data.py

      - name: Switch site to lazy loader
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          external = '<script src="app.js?v=20260810"></script>'
          if external not in text:
              new, n = re.subn(r'<script>\s*\'use strict\';.*?</script>', external, text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit('Could not replace inline app script')
              p.write_text(new, encoding='utf-8')
          PY

      - name: Verify generated data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('data/validation.json').read_text(encoding='utf-8'))
          assert v['ok'] is True
          assert v['field_level_content_identical'] is True
          assert v['row_count_before'] == v['row_count_after']
          print('Verified rows:', v['row_count_after'])
          print('SHA256:', v['content_sha256_after'])
          PY

      - name: Commit canonical data and loader
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: lazy-load canonical 10-page vocabulary data"
          git push
