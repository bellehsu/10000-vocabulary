name: Validate vocabulary data

on:
  push:
    branches: ["main"]
    paths:
      - "data/pages-*.csv"
      - "scripts/rebuild_data.py"
      - ".github/workflows/validate-vocabulary.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vocabulary-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild indexes and validation report
        run: python scripts/rebuild_data.py

      - name: Verify review deduplication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/validation.json').read_text(encoding='utf-8'))
          assert report['same_page_duplicate_count'] == 0
          assert report['review_duplicate_count'] == 0
          assert report['review_deduplication_ok'] is True
          print('Cross-page duplicate words:', report['cross_page_duplicate_count'])
          for item in report['cross_page_duplicates']:
              print(f"- {item['word']}: {item['pages']}")
          PY

      - name: Commit generated report and indexes
        if: github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- data/manifest.json data/index.json data/validation.json data/pages-*.csv; then
            echo "Generated files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifest.json data/index.json data/validation.json data/pages-*.csv
          git commit -m "Refresh vocabulary validation report"
          git push
