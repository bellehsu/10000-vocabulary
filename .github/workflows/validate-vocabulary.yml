name: Validate vocabulary data

on:
  push:
    branches: ["main"]
    paths:
      - "data/pages-*.csv"
      - "scripts/rebuild_data.py"
      - ".github/workflows/validate-vocabulary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vocabulary-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild indexes and validation report
        run: python scripts/rebuild_data.py

      - name: Verify generated vocabulary data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('data/manifest.json').read_text(encoding='utf-8'))
          report = json.loads(Path('data/validation.json').read_text(encoding='utf-8'))

          assert report['ok'] is True
          assert report['same_page_duplicate_count'] == 0
          assert report['review_duplicate_count'] == 0
          assert report['review_deduplication_ok'] is True
          assert manifest['last_page'] is not None
          assert manifest['total_words'] == report['row_count_after']

          print('Vocabulary pages:', manifest['first_page'], '-', manifest['last_page'])
          print('Total words:', manifest['total_words'])
          print('Cross-page duplicate words:', report['cross_page_duplicate_count'])
          for item in report['cross_page_duplicates']:
              print(f"- {item['word']}: {item['pages']}")
          PY
