<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><title>10000 Vocabulary</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#17202a;background:#f4f7f6;line-height:1.55}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:5;background:#0f766e;color:#fff;padding:13px 16px}.top h1{font-size:20px;margin:0}.tabs{display:flex;gap:7px;margin-top:9px;overflow:auto}.tabs button{border:0;border-radius:999px;padding:8px 12px;background:#ffffff25;color:#fff;white-space:nowrap}.tabs .active{background:#fff;color:#0f766e;font-weight:750}main{max-width:900px;margin:auto;padding:16px}.panel,.face{background:#fff;border-radius:18px;box-shadow:0 4px 18px #0000000d}.panel{padding:16px;margin-bottom:14px}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:8px}.filters input,.filters select,.quiz-controls select,.quiz-controls input{width:100%;padding:10px;border:1px solid #ccd7d4;border-radius:10px;background:#fff}.word-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:15px 0;border-bottom:1px solid #edf1f0}.word-row:last-child{border:0}.word{font-size:21px;font-weight:800;color:#0f766e}.pos{font-size:13px;font-style:italic;color:#63716d}.zh{margin-top:4px}.meta{font-size:13px;color:#65736f}.actions,.rating,.card-nav{display:flex;gap:7px;flex-wrap:wrap}.actions{justify-content:flex-end}.small,.primary{border-radius:10px;padding:8px 11px}.small{border:1px solid #b9cbc6;background:#fff}.primary{border:0;background:#0f766e;color:#fff}.danger{border-color:#dc6b6b;color:#a02b2b}.card-wrap{perspective:1000px;min-height:510px}.card{position:relative;min-height:490px;transition:.48s;transform-style:preserve-3d}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;padding:24px}.front{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.back{transform:rotateY(180deg);overflow:auto}.word-line{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.front-word{font-size:42px;font-weight:850;color:#0f766e;word-break:break-word}.front-pos{font-size:16px;color:#63716d;font-style:italic;margin-top:3px}.speak-icon{border:0;background:#e8f5f2;color:#0f766e;border-radius:999px;width:42px;height:42px;font-size:20px}.hint{color:#687873}.back-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid #e4ecea;padding-bottom:12px;margin-bottom:13px}.back h2{color:#0f766e;margin:0;font-size:30px}.field{margin:12px 0}.label{display:block;font-size:12px;font-weight:800;letter-spacing:.06em;color:#71817c;margin-bottom:3px}.example{font-size:17px}.example-zh{color:#566661;margin-top:4px}.memory{background:#eef8f5;border-radius:12px;padding:12px}.syn{color:#176b5d}.ant{color:#9a4242}.stars{letter-spacing:2px;color:#b7791f}.card-nav,.rating{justify-content:center;margin-top:13px}.rating button{border:0;border-radius:10px;padding:10px 14px}.r0{background:#fee2e2}.r1{background:#fef3c7}.r2{background:#dcfce7}.quiz-controls{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.question{font-size:25px;font-weight:800;margin:18px 0;color:#0f766e}.choices{display:grid;gap:10px}.choices button{text-align:left;border:1px solid #cbd8d4;background:#fff;border-radius:12px;padding:13px}.choices .correct{background:#dcfce7;border-color:#38a169}.choices .wrong{background:#fee2e2;border-color:#e53e3e}.feedback{margin-top:12px;font-weight:700}.stats{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;color:#52635e}.issue{margin-top:14px;border-top:1px solid #e4ecea;padding-top:12px}.badge{display:inline-block;border-radius:999px;padding:3px 8px;background:#eef3f2;font-size:12px}.hidden{display:none!important}pre{white-space:pre-wrap;word-break:break-word}@media(max-width:700px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.quiz-controls{grid-template-columns:1fr}.front-word{font-size:34px}.face{padding:19px}.word-row{grid-template-columns:1fr}.actions{justify-content:flex-start}.card-wrap{min-height:550px}.card{min-height:530px}}
</style></head><body>
<header class="top"><h1>10000 Vocabulary</h1><nav class="tabs"><button data-tab="list" class="active">單字列表</button><button data-tab="cards">單字卡</button><button data-tab="quiz">測驗</button><button data-tab="mistakes">錯題複習</button><button data-tab="reports">資料驗證</button></nav></header>
<main>
<section id="list" class="tab"><div class="panel filters"><input id="search" placeholder="搜尋英文、中文或例句"><select id="pageFilter"><option value="">全部頁碼</option></select><select id="posFilter"><option value="">全部詞性</option></select><select id="levelFilter"><option value="">全部熟悉度</option><option value="0">不熟</option><option value="1">模糊</option><option value="2">熟悉</option></select></div><div class="panel"><div id="listStats" class="stats"></div><div id="wordList"></div></div></section>
<section id="cards" class="tab hidden"><div class="panel filters"><select id="cardPage"><option value="">全部頁碼</option></select><select id="cardLevel"><option value="">全部熟悉度</option><option value="0">不熟</option><option value="1">模糊</option><option value="2">熟悉</option></select></div><div class="card-wrap"><div id="card" class="card"><article class="face front"><div class="word-line"><div id="frontWord" class="front-word"></div><button id="speakCard" class="speak-icon" aria-label="播放發音">🔊</button></div><div id="frontPos" class="front-pos"></div><p class="hint">點卡片翻面</p></article><article class="face back"><div class="back-head"><div><h2 id="backWord"></h2><div id="backPos" class="pos"></div></div><button id="speakBack" class="speak-icon" aria-label="播放發音">🔊</button></div><div class="field"><span class="label">中文</span><div id="backZh"></div></div><div class="field"><span class="label">課本例句</span><div id="backExample" class="example"></div><div id="backExampleZh" class="example-zh"></div></div><div class="field"><span class="label">同義字</span><div id="backSyn" class="syn"></div></div><div class="field"><span class="label">反義字</span><div id="backAnt" class="ant"></div></div><div class="field memory"><span class="label">記憶提示</span><div id="backMemory"></div></div><div class="field"><span class="label">出自頁碼</span><div id="backPage"></div></div><div class="field"><span class="label">難度</span><div id="backDifficulty" class="stars"></div></div></article></div></div><div class="card-nav"><button id="prevCard" class="small">上一張</button><button id="nextCard" class="primary">下一張</button></div><div class="rating"><button class="r0" data-rate="0">不熟</button><button class="r1" data-rate="1">模糊</button><button class="r2" data-rate="2">熟悉</button></div><div id="cardIssue" class="issue"></div></section>
<section id="quiz" class="tab hidden"><div class="panel"><div class="quiz-controls"><select id="quizType"><option value="en-zh">英翻中（四選一）</option><option value="zh-en">中翻英（四選一）</option><option value="spell">拼字輸入</option></select><select id="quizPage"><option value="">全部頁碼</option></select><button id="newQuiz" class="primary">下一題</button></div><div id="quizStats" class="stats"></div><div id="question" class="question"></div><button id="speakQuiz" class="small hidden">🔊 發音</button><div id="choices" class="choices"></div><form id="spellForm" class="hidden"><input id="spellInput" autocomplete="off" autocapitalize="none" placeholder="輸入英文拼字"><button class="primary" type="submit">送出</button></form><div id="feedback" class="feedback"></div></div></section>
<section id="mistakes" class="tab hidden"><div class="panel"><h2>錯題複習</h2><p class="meta">依答錯次數由高到低排列。</p><div id="mistakeList"></div></div></section>
<section id="reports" class="tab hidden"><div class="panel"><h2>資料驗證</h2><p>發現例句、翻譯、詞性或其他內容有問題時，按「回報資料問題」。紀錄只保存在目前瀏覽器。</p><div class="actions"><button id="copyReports" class="primary">複製驗證紀錄</button><button id="clearReports" class="small danger">清除紀錄</button></div><pre id="reportOutput"></pre></div></section></main>
<script>
const DATA_URL='data/vocabulary-pages-12-15.csv',KEY='vocab-progress-v1',REPORT_KEY='vocab-reports-v1';let words=[],filtered=[],cardWords=[],cardIndex=0,quizWord=null,quizAnswered=false;let progress=JSON.parse(localStorage.getItem(KEY)||'{}'),reports=JSON.parse(localStorage.getItem(REPORT_KEY)||'[]');const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function csv(text){const rows=[];let row=[],v='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){v+='"';i++}else if(c==='"'){q=!q}else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(v);if(row.some(x=>x!==''))rows.push(row);row=[];v=''}else v+=c}if(v||row.length){row.push(v);rows.push(row)}const h=rows.shift();return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]||''])))}function state(w){return progress[w]||{level:null,wrong:0,right:0}}function save(){localStorage.setItem(KEY,JSON.stringify(progress));renderAll()}function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.speak(u)}function pageParts(p){return p.split(/[–-]/).map(x=>x.trim())}function pages(){return [...new Set(words.flatMap(w=>pageParts(w.page)))].sort((a,b)=>+a-+b)}function fillSelects(){for(const id of ['pageFilter','cardPage','quizPage'])pages().forEach(p=>$(id).insertAdjacentHTML('beforeend',`<option value="${p}">第 ${p} 頁</option>`));[...new Set(words.map(w=>w.part_of_speech))].sort().forEach(p=>$('#posFilter').insertAdjacentHTML('beforeend',`<option value="${p}">${p}</option>`))}function issueUI(w){return `<button class="small danger report-btn" data-word="${esc(w.word)}">回報資料問題</button>`}function stars(n){return '★'.repeat(+n)+'☆'.repeat(5-+n)+`（${n} / 5）`}function renderList(){const q=$('#search').value.trim().toLowerCase(),p=$('#pageFilter').value,pos=$('#posFilter').value,l=$('#levelFilter').value;filtered=words.filter(w=>(!q||[w.word,w.chinese,w.example,w.example_zh].join(' ').toLowerCase().includes(q))&&(!p||pageParts(w.page).includes(p))&&(!pos||w.part_of_speech===pos)&&(l===''||String(state(w.word).level)===l));$('#listStats').textContent=`顯示 ${filtered.length} / ${words.length} 筆`;$('#wordList').innerHTML=filtered.map(w=>`<div class="word-row"><div><div class="word">${esc(w.word)}</div><div class="pos">${esc(w.part_of_speech)}</div><div class="zh">${esc(w.chinese)}</div><div class="meta">第 ${esc(w.page)} 頁｜${stars(w.difficulty)}｜錯 ${state(w.word).wrong} 次</div></div><div class="actions"><button class="small speak" data-word="${esc(w.word)}">🔊</button>${issueUI(w)}</div></div>`).join('')}function updateCards(){const p=$('#cardPage').value,l=$('#cardLevel').value;cardWords=words.filter(w=>(!p||pageParts(w.page).includes(p))&&(l===''||String(state(w.word).level)===l));cardIndex=Math.min(cardIndex,Math.max(0,cardWords.length-1));renderCard()}function renderCard(){const w=cardWords[cardIndex];if(!w){$('#frontWord').textContent='沒有符合條件的單字';return}$('#card').classList.remove('flipped');for(const id of ['frontWord','backWord'])$('#'+id).textContent=w.word;$('#frontPos').textContent=$('#backPos').textContent=w.part_of_speech;$('#backZh').textContent=w.chinese;$('#backExample').textContent=w.example;$('#backExampleZh').textContent=w.example_zh;$('#backSyn').textContent=w.synonyms||'—';$('#backAnt').textContent=w.antonyms||'—';$('#backMemory').textContent=w.memory_hint;$('#backPage').textContent=`第 ${w.page} 頁`;$('#backDifficulty').textContent=stars(w.difficulty);$('#cardIssue').innerHTML=issueUI(w)}function setLevel(level){const w=cardWords[cardIndex];if(!w)return;progress[w.word]={...state(w.word),level:+level};save();cardIndex=(cardIndex+1)%cardWords.length;renderCard()}function pool(){const p=$('#quizPage').value;return words.filter(w=>!p||pageParts(w.page).includes(p))}function weightedPick(a){const x=a.flatMap(w=>Array(Math.max(1,1+state(w.word).wrong*2)).fill(w));return x[Math.floor(Math.random()*x.length)]}function newQuiz(){const a=pool();if(!a.length)return;quizWord=weightedPick(a);quizAnswered=false;$('#feedback').textContent='';$('#choices').innerHTML='';$('#spellInput').value='';const t=$('#quizType').value;$('#spellForm').classList.toggle('hidden',t!=='spell');$('#speakQuiz').classList.toggle('hidden',t==='zh-en');if(t==='en-zh'){question.textContent=quizWord.word;makeChoices('chinese')}else if(t==='zh-en'){question.textContent=quizWord.chinese;makeChoices('word')}else{question.textContent=quizWord.chinese;$('#spellInput').focus()}renderQuizStats()}function makeChoices(field){let o=[quizWord],a=pool().filter(w=>w.word!==quizWord.word).sort(()=>Math.random()-.5);o.push(...a.slice(0,3));o.sort(()=>Math.random()-.5);$('#choices').innerHTML=o.map(w=>`<button data-answer="${esc(w.word)}">${esc(w[field])}</button>`).join('')}function answer(ok,shown){if(quizAnswered)return;quizAnswered=true;const s=state(quizWord.word);progress[quizWord.word]={...s,right:s.right+(ok?1:0),wrong:s.wrong+(ok?0:1)};localStorage.setItem(KEY,JSON.stringify(progress));$('#feedback').textContent=ok?'答對了！':`答錯了。正確答案：${quizWord.word} — ${quizWord.chinese}`;if(shown)$$('#choices button').forEach(b=>{if(b.dataset.answer===quizWord.word)b.classList.add('correct');else if(b===shown)b.classList.add('wrong')});renderQuizStats();renderMistakes()}function renderQuizStats(){let r=0,w=0;Object.values(progress).forEach(x=>{r+=x.right||0;w+=x.wrong||0});$('#quizStats').textContent=`答對 ${r} 題｜答錯 ${w} 題`}function renderMistakes(){const a=words.filter(w=>state(w.word).wrong).sort((a,b)=>state(b.word).wrong-state(a.word).wrong);$('#mistakeList').innerHTML=a.length?a.map(w=>`<div class="word-row"><div><div class="word">${esc(w.word)} <span class="badge">${state(w.word).wrong} 次</span></div><div>${esc(w.chinese)}</div></div><button class="small speak" data-word="${esc(w.word)}">🔊</button></div>`).join(''):'目前沒有錯題。'}function report(word){const w=words.find(x=>x.word===word),note=prompt(`請描述「${word}」哪裡需要修正：`);if(!note)return;reports.push({word,note,recordedAt:new Date().toISOString(),snapshot:w});localStorage.setItem(REPORT_KEY,JSON.stringify(reports));renderReports()}function renderReports(){$('#reportOutput').textContent=JSON.stringify(reports,null,2)}function renderAll(){renderList();updateCards();renderMistakes();renderReports();renderQuizStats()}document.addEventListener('click',e=>{const t=e.target;if(t.matches('.tabs button')){$$('.tabs button').forEach(b=>b.classList.remove('active'));t.classList.add('active');$$('.tab').forEach(s=>s.classList.add('hidden'));$('#'+t.dataset.tab).classList.remove('hidden')}if(t.matches('.speak'))speak(t.dataset.word);if(t.matches('.report-btn'))report(t.dataset.word);if(t.closest('#card')&&!t.matches('button'))$('#card').classList.toggle('flipped');if(t.matches('#speakCard,#speakBack')){e.stopPropagation();const w=cardWords[cardIndex];if(w)speak(w.word)}if(t.matches('[data-rate]'))setLevel(t.dataset.rate);if(t.matches('#prevCard')){cardIndex=(cardIndex-1+cardWords.length)%cardWords.length;renderCard()}if(t.matches('#nextCard')){cardIndex=(cardIndex+1)%cardWords.length;renderCard()}if(t.matches('#choices button'))answer(t.dataset.answer===quizWord.word,t);if(t.matches('#speakQuiz')&&quizWord)speak(quizWord.word)});$('#spellForm').addEventListener('submit',e=>{e.preventDefault();answer($('#spellInput').value.trim().toLowerCase()===quizWord.word.toLowerCase())});['search','pageFilter','posFilter','levelFilter'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',renderList));['cardPage','cardLevel'].forEach(id=>$('#'+id).addEventListener('change',updateCards));$('#quizPage').addEventListener('change',newQuiz);$('#quizType').addEventListener('change',newQuiz);$('#newQuiz').addEventListener('click',newQuiz);$('#copyReports').addEventListener('click',()=>navigator.clipboard.writeText(JSON.stringify(reports,null,2)));$('#clearReports').addEventListener('click',()=>{if(confirm('確定清除？')){reports=[];localStorage.removeItem(REPORT_KEY);renderReports()}});fetch(DATA_URL).then(r=>r.text()).then(t=>{words=csv(t);cardWords=words;fillSelects();renderAll();newQuiz()}).catch(()=>{$('#wordList').textContent='資料載入失敗，請重新整理。'});
</script></body></html>
