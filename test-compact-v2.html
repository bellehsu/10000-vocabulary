<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>10000 Vocabulary — 測試版 v4</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#17202a;background:#f4f7f6;line-height:1.5}*{box-sizing:border-box}body{margin:0}button,select,input{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;background:#0f766e;color:white;padding:14px 16px}.top h1{margin:0;font-size:20px}.top small{opacity:.85}.tabs{display:flex;gap:8px;margin-top:10px}.tabs button{border:0;border-radius:999px;padding:8px 14px;background:#ffffff25;color:white}.tabs button.active{background:white;color:#0f766e;font-weight:700}main{max-width:800px;margin:auto;padding:16px}.hidden{display:none!important}.panel,.face{background:white;border-radius:18px;box-shadow:0 4px 18px #0000000d}.panel{padding:16px;margin-bottom:14px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input,.filters select{padding:10px;border:1px solid #ccd7d4;border-radius:10px;background:white;min-width:150px;flex:1}.status{font-size:13px;color:#52635e;margin-bottom:10px}.word-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid #edf1f0}.word{font-size:21px;font-weight:800;color:#0f766e}.pos{font-size:13px;font-style:italic;color:#63716d}.zh{margin-top:4px}.meta{font-size:13px;color:#65736f}.small,.primary,.speak{border-radius:10px;padding:8px 11px}.small{border:1px solid #b9cbc6;background:white}.primary{border:0;background:#0f766e;color:white}.speak{border:0;background:#e8f5f2;color:#0f766e;border-radius:999px;width:42px;height:42px}.card-wrap{perspective:1000px;min-height:520px}.card{position:relative;min-height:500px;transition:.45s;transform-style:preserve-3d}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;padding:22px}.front{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.back{transform:rotateY(180deg);overflow:auto}.word-line{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.front-word{font-size:42px;font-weight:850;color:#0f766e}.back-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #e4ecea;padding-bottom:10px}.back h2{margin:0;color:#0f766e;font-size:30px}.field{margin:11px 0}.label{display:block;font-size:12px;font-weight:800;letter-spacing:.05em;color:#71817c;margin-bottom:2px}.example{font-size:17px}.example-zh{color:#566661;margin-top:3px}.memory{background:#eef8f5;border-radius:12px;padding:11px}.syn{color:#176b5d}.ant{color:#9a4242}.compact-meta{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-top:10px}.compact-meta .field{margin:0;min-width:110px}.stars{color:#b7791f;letter-spacing:1px}.nav{display:flex;justify-content:center;gap:8px;margin-top:14px}.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:12px}@media(max-width:600px){.front-word{font-size:34px}.face{padding:18px}.card-wrap{min-height:560px}.card{min-height:540px}.compact-meta{gap:16px}.compact-meta .field{min-width:90px}.word-row{grid-template-columns:1fr}.word-row .speak{justify-self:start}}
</style>
</head>
<body>
<header class="top"><h1>10000 Vocabulary</h1><small>資料顯示與按鈕測試版 v4</small><div class="tabs"><button type="button" data-tab="list" class="active">單字列表</button><button type="button" data-tab="cards">單字卡</button></div></header>
<main>
<section id="list" class="tab"><div class="panel filters"><input id="search" placeholder="搜尋英文、中文或例句"><select id="pageFilter"><option value="">全部頁碼</option></select><select id="posFilter"><option value="">全部詞性</option></select></div><div class="panel"><div id="status" class="status">載入中…</div><div id="wordList"></div></div></section>
<section id="cards" class="tab hidden"><div class="panel filters"><select id="cardPage"><option value="">全部頁碼</option></select></div><div class="card-wrap"><div id="card" class="card"><article class="face front"><div class="word-line"><div id="frontWord" class="front-word"></div><button type="button" id="speakFront" class="speak" aria-label="播放發音">🔊</button></div><div id="frontPos" class="pos"></div><p class="meta">點卡片空白處翻面</p></article><article class="face back"><div class="back-head"><div><h2 id="backWord"></h2><div id="backPos" class="pos"></div></div><button type="button" id="speakBack" class="speak" aria-label="播放發音">🔊</button></div><div class="field"><span class="label">中文</span><div id="backZh"></div></div><div class="field"><span class="label">課本例句</span><div id="backExample" class="example"></div><div id="backExampleZh" class="example-zh"></div></div><div class="field"><span class="label">同義字</span><div id="backSyn" class="syn"></div></div><div class="field"><span class="label">反義字</span><div id="backAnt" class="ant"></div></div><div class="field memory"><span class="label">記憶提示</span><div id="backMemory"></div></div><div class="compact-meta"><div class="field"><span class="label">頁碼</span><div id="backPage"></div></div><div class="field"><span class="label">難度</span><div id="backDifficulty" class="stars"></div></div></div></article></div></div><div class="nav"><button type="button" id="prev" class="small">上一張</button><button type="button" id="flip" class="small">翻面</button><button type="button" id="next" class="primary">下一張</button></div></section>
</main>
<script>
'use strict';
const DATA_URL='data/vocabulary-pages-12-15.csv?v=4';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
let words=[],cardWords=[],cardIndex=0;
function csv(text){const rows=[];let row=[],value='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quoted&&n==='"'){value+='"';i++}else if(c==='"'){quoted=!quoted}else if(c===','&&!quoted){row.push(value);value=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(value);if(row.some(v=>v!==''))rows.push(row);row=[];value=''}else value+=c}if(value||row.length){row.push(value);rows.push(row)}const headers=rows.shift().map(h=>h.replace(/^\uFEFF/,'').trim());return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]??'').trim()]))) }
function normalize(r){return{word:r.word||'',part_of_speech:r.part_of_speech||r.pos||r['詞性']||'待確認',example:r.example||r['例句']||'',example_zh:r.example_zh||r['例句中文']||'',chinese:r.chinese||r['中文']||'',synonyms:r.synonyms||r['同義字']||'',antonyms:r.antonyms||r['反義字']||'',memory_hint:r.memory_hint||r['祕段落']||'',page:r.page||r['頁碼']||'',difficulty:r.difficulty||r['難度']||''}}
function pageParts(p=''){return p.split(/[–-]/).map(x=>x.trim()).filter(Boolean)}
function stars(n){const x=Math.max(0,Math.min(5,Number(n)||0));return `${'★'.repeat(x)}${'☆'.repeat(5-x)}（${x}/5）`}
function speak(word){if(!word)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-US';speechSynthesis.speak(u)}
function fillFilters(){const pages=[...new Set(words.flatMap(w=>pageParts(w.page)))].sort((a,b)=>+a-+b);for(const id of ['pageFilter','cardPage'])pages.forEach(p=>$('#'+id).insertAdjacentHTML('beforeend',`<option value="${p}">第 ${p} 頁</option>`));[...new Set(words.map(w=>w.part_of_speech))].sort().forEach(p=>$('#posFilter').insertAdjacentHTML('beforeend',`<option value="${p}">${p}</option>`))}
function renderList(){const q=$('#search').value.trim().toLowerCase(),page=$('#pageFilter').value,pos=$('#posFilter').value;const list=words.filter(w=>(!q||[w.word,w.chinese,w.example,w.example_zh].join(' ').toLowerCase().includes(q))&&(!page||pageParts(w.page).includes(page))&&(!pos||w.part_of_speech===pos));$('#status').textContent=`已載入 ${words.length} 筆；目前顯示 ${list.length} 筆。`;$('#wordList').innerHTML=list.map(w=>`<div class="word-row"><div><div class="word">${w.word}</div><div class="pos">${w.part_of_speech}</div><div class="zh">${w.chinese||'—'}</div><div class="meta">頁碼 ${w.page||'—'}｜${stars(w.difficulty)}</div></div><button type="button" class="speak say" data-word="${w.word}" aria-label="播放 ${w.word} 發音">🔊</button></div>`).join('')}
function updateCards(){const p=$('#cardPage').value;cardWords=words.filter(w=>!p||pageParts(w.page).includes(p));cardIndex=Math.min(cardIndex,Math.max(0,cardWords.length-1));renderCard()}
function renderCard(){const w=cardWords[cardIndex];if(!w){$('#frontWord').textContent='沒有符合條件的單字';return}$('#card').classList.remove('flipped');$('#frontWord').textContent=$('#backWord').textContent=w.word;$('#frontPos').textContent=$('#backPos').textContent=w.part_of_speech;$('#backZh').textContent=w.chinese||'—';$('#backExample').textContent=w.example||'—';$('#backExampleZh').textContent=w.example_zh||'—';$('#backSyn').textContent=w.synonyms||'—';$('#backAnt').textContent=w.antonyms||'—';$('#backMemory').textContent=w.memory_hint||'—';$('#backPage').textContent=w.page||'—';$('#backDifficulty').textContent=stars(w.difficulty)}
function flip(){if(cardWords.length)$('#card').classList.toggle('flipped')}
document.addEventListener('click',e=>{const t=e.target;if(t.matches('[data-tab]')){$$('[data-tab]').forEach(b=>b.classList.remove('active'));t.classList.add('active');$$('.tab').forEach(s=>s.classList.add('hidden'));$('#'+t.dataset.tab).classList.remove('hidden');return}if(t.matches('.say')){speak(t.dataset.word);return}if(t.matches('#speakFront,#speakBack')){e.stopPropagation();speak(cardWords[cardIndex]?.word);return}if(t.matches('#prev')){if(cardWords.length){cardIndex=(cardIndex-1+cardWords.length)%cardWords.length;renderCard()}return}if(t.matches('#next')){if(cardWords.length){cardIndex=(cardIndex+1)%cardWords.length;renderCard()}return}if(t.matches('#flip')){flip();return}if(t.closest('#card')&&!t.closest('button'))flip()});
$('#search').addEventListener('input',renderList);$('#pageFilter').addEventListener('change',renderList);$('#posFilter').addEventListener('change',renderList);$('#cardPage').addEventListener('change',updateCards);
fetch(DATA_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.text()}).then(text=>{words=csv(text).map(normalize).filter(w=>w.word);cardWords=words;fillFilters();renderList();renderCard()}).catch(err=>{$('#status').innerHTML=`<div class="error">資料載入失敗：${err.message}</div>`});
</script>
</body>
</html>
