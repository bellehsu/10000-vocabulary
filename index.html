<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>10000 Vocabulary</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#17202a;background:#f4f7f6;line-height:1.5}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:5;background:#0f766e;color:#fff;padding:14px 16px}.top h1{font-size:20px;margin:0}.tabs{display:flex;gap:8px;margin-top:10px;overflow:auto}.tabs button{border:0;border-radius:999px;padding:8px 13px;background:#ffffff24;color:#fff;white-space:nowrap}.tabs button.active{background:#fff;color:#0f766e;font-weight:700}main{max-width:900px;margin:auto;padding:16px}.panel{background:#fff;border-radius:16px;padding:16px;box-shadow:0 3px 16px #0000000d;margin-bottom:14px}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:8px}.filters input,.filters select,.quiz-controls select,.quiz-controls input{width:100%;padding:10px;border:1px solid #ccd7d4;border-radius:10px;background:#fff}.word-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 0;border-bottom:1px solid #edf1f0}.word-row:last-child{border:0}.word{font-size:20px;font-weight:750;color:#0f766e}.meta{font-size:13px;color:#65736f}.zh{margin-top:4px}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.small{border:1px solid #b9cbc6;background:#fff;border-radius:9px;padding:6px 9px}.primary{border:0;background:#0f766e;color:#fff;border-radius:10px;padding:10px 14px}.danger{border:1px solid #dc6b6b;color:#a02b2b;background:#fff}.card-wrap{perspective:1000px;min-height:340px}.card{position:relative;min-height:320px;transition:.5s;transform-style:preserve-3d}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;background:#fff;border-radius:20px;box-shadow:0 8px 28px #00000016;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.back{transform:rotateY(180deg);align-items:stretch;text-align:left}.front-word{font-size:42px;font-weight:800;color:#0f766e;word-break:break-word}.hint{color:#687873}.back h2{color:#0f766e;margin:0 0 10px}.memory{background:#eef8f5;border-radius:12px;padding:12px}.card-nav,.rating{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}.rating button{border:0;border-radius:10px;padding:10px 14px}.r0{background:#fee2e2}.r1{background:#fef3c7}.r2{background:#dcfce7}.quiz-controls{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.question{font-size:24px;font-weight:750;margin:18px 0;color:#0f766e}.choices{display:grid;gap:10px}.choices button{text-align:left;border:1px solid #cbd8d4;background:#fff;border-radius:12px;padding:13px}.choices button.correct{background:#dcfce7;border-color:#38a169}.choices button.wrong{background:#fee2e2;border-color:#e53e3e}.feedback{margin-top:12px;font-weight:700}.stats{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;color:#52635e}.issue{margin-top:14px;border-top:1px solid #e4ecea;padding-top:12px}.issue textarea{width:100%;min-height:80px;border:1px solid #ccd7d4;border-radius:10px;padding:10px}.badge{display:inline-block;border-radius:999px;padding:3px 8px;background:#eef3f2;font-size:12px}.hidden{display:none!important}@media(max-width:700px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.quiz-controls{grid-template-columns:1fr}.front-word{font-size:34px}.face{padding:20px}.word-row{grid-template-columns:1fr}.actions{justify-content:flex-start}}
  </style>
</head>
<body>
<header class="top"><h1>10000 Vocabulary</h1><nav class="tabs"><button data-tab="list" class="active">單字列表</button><button data-tab="cards">單字卡</button><button data-tab="quiz">測驗</button><button data-tab="mistakes">錯題複習</button><button data-tab="reports">資料驗證</button></nav></header>
<main>
<section id="list" class="tab"><div class="panel filters"><input id="search" placeholder="搜尋英文、中文或例句"><select id="pageFilter"><option value="">全部頁碼</option></select><select id="posFilter"><option value="">全部詞性</option></select><select id="levelFilter"><option value="">全部熟悉度</option><option value="0">不熟</option><option value="1">模糊</option><option value="2">熟悉</option></select></div><div class="panel"><div id="listStats" class="stats"></div><div id="wordList"></div></div></section>
<section id="cards" class="tab hidden"><div class="panel filters"><select id="cardPage"><option value="">全部頁碼</option></select><select id="cardLevel"><option value="">全部熟悉度</option><option value="0">不熟</option><option value="1">模糊</option><option value="2">熟悉</option></select></div><div class="card-wrap"><div id="card" class="card"><article class="face front"><div id="frontWord" class="front-word"></div><button id="speakCard" class="small">🔊 發音</button><p class="hint">點卡片翻面</p></article><article class="face back"><h2 id="backWord"></h2><p id="backZh"></p><p id="backExample"></p><div id="backMemory" class="memory"></div><div id="backMeta" class="meta"></div></article></div></div><div class="card-nav"><button id="prevCard" class="small">上一張</button><button id="nextCard" class="primary">下一張</button></div><div class="rating"><button class="r0" data-rate="0">不熟</button><button class="r1" data-rate="1">模糊</button><button class="r2" data-rate="2">熟悉</button></div><div id="cardIssue" class="issue"></div></section>
<section id="quiz" class="tab hidden"><div class="panel"><div class="quiz-controls"><select id="quizType"><option value="en-zh">英翻中（四選一）</option><option value="zh-en">中翻英（四選一）</option><option value="spell">拼字輸入</option></select><select id="quizPage"><option value="">全部頁碼</option></select><button id="newQuiz" class="primary">下一題</button></div><div id="quizStats" class="stats"></div><div id="question" class="question"></div><button id="speakQuiz" class="small hidden">🔊 發音</button><div id="choices" class="choices"></div><form id="spellForm" class="hidden"><input id="spellInput" autocomplete="off" autocapitalize="none" placeholder="輸入英文拼字"><button class="primary" type="submit">送出</button></form><div id="feedback" class="feedback"></div></div></section>
<section id="mistakes" class="tab hidden"><div class="panel"><h2>錯題複習</h2><p class="meta">依答錯次數由高到低排列。</p><div id="mistakeList"></div></div></section>
<section id="reports" class="tab hidden"><div class="panel"><h2>資料驗證</h2><p>複習時按「回報資料問題」，紀錄會保存在這台裝置。確認後可複製 JSON 貼回此專案，我再依紀錄修正資料。</p><div class="actions"><button id="copyReports" class="primary">複製驗證紀錄</button><button id="clearReports" class="small danger">清除紀錄</button></div><pre id="reportOutput" style="white-space:pre-wrap;word-break:break-word"></pre></div></section>
</main>
<script>
const DATA_URL='data/vocabulary-pages-12-15.csv';
const KEY='vocab-progress-v1', REPORT_KEY='vocab-reports-v1';
let words=[], filtered=[], cardWords=[], cardIndex=0, quizWord=null, quizAnswered=false;
let progress=JSON.parse(localStorage.getItem(KEY)||'{}');
let reports=JSON.parse(localStorage.getItem(REPORT_KEY)||'[]');
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function csv(text){const rows=[];let row=[],v='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){v+='"';i++}else if(c==='"'){q=!q}else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(v);if(row.some(x=>x!==''))rows.push(row);row=[];v=''}else v+=c}if(v||row.length){row.push(v);rows.push(row)}const h=rows.shift();return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]||''])))}
function inferPOS(w,zh){if(/ly$/.test(w))return '副詞';if(/tion$|sion$|ance$|ence$|ment$|ness$|ist$|or$/.test(w))return '名詞';if(/ed$|ive$|able$|ible$|ant$|ent$|ous$|al$/.test(w))return '形容詞';if(/ate$|ize$|fy$/.test(w))return '動詞';if(zh.includes('的'))return '形容詞';return '其他'}
function state(w){return progress[w]||{level:null,wrong:0,right:0}}
function save(){localStorage.setItem(KEY,JSON.stringify(progress));renderAll()}
function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.speak(u)}
function pages(){return [...new Set(words.flatMap(w=>w['頁碼'].split('-')))].sort((a,b)=>+a-+b)}
function fillSelects(){for(const id of ['pageFilter','cardPage','quizPage']){const s=$(id);pages().forEach(p=>s.insertAdjacentHTML('beforeend',`<option value="${p}">第 ${p} 頁</option>`))}const pos=[...new Set(words.map(w=>w.pos))];pos.forEach(p=>$('#posFilter').insertAdjacentHTML('beforeend',`<option>${p}</option>`))}
function issueUI(w){return `<button class="small danger report-btn" data-word="${w.word}">回報資料問題</button>`}
function renderList(){const q=$('#search').value.trim().toLowerCase(),p=$('#pageFilter').value,pos=$('#posFilter').value,l=$('#levelFilter').value;filtered=words.filter(w=>(!q||[w.word,w['中文'],w.example].join(' ').toLowerCase().includes(q))&&(!p||w['頁碼'].split('-').includes(p))&&(!pos||w.pos===pos)&&(l===''||String(state(w.word).level)===l));$('#listStats').textContent=`顯示 ${filtered.length} / ${words.length} 筆`;$('#wordList').innerHTML=filtered.map(w=>`<div class="word-row"><div><div class="word">${w.word} <span class="badge">${w.pos}</span></div><div class="zh">${w['中文']}</div><div class="meta">第 ${w['頁碼']} 頁・難度 ${'★'.repeat(+w['難度'])}${'☆'.repeat(5-+w['難度'])}・錯 ${state(w.word).wrong} 次</div></div><div class="actions"><button class="small speak" data-word="${w.word}">🔊</button>${issueUI(w)}</div></div>`).join('')}
function updateCards(){const p=$('#cardPage').value,l=$('#cardLevel').value;cardWords=words.filter(w=>(!p||w['頁碼'].split('-').includes(p))&&(l===''||String(state(w.word).level)===l));cardIndex=Math.min(cardIndex,Math.max(0,cardWords.length-1));renderCard()}
function renderCard(){const w=cardWords[cardIndex];if(!w){$('#frontWord').textContent='沒有符合條件的單字';return}$('#card').classList.remove('flipped');$('#frontWord').textContent=w.word;$('#backWord').textContent=w.word;$('#backZh').textContent=w['中文'];$('#backExample').textContent=w.example;$('#backMemory').textContent='記憶提示：'+w['祕段落'];$('#backMeta').textContent=`同義／反義：${w['同義字']}｜第 ${w['頁碼']} 頁｜難度 ${w['難度']} 星`;$('#cardIssue').innerHTML=issueUI(w)}
function setLevel(level){const w=cardWords[cardIndex];if(!w)return;progress[w.word]={...state(w.word),level:+level};save();cardIndex=(cardIndex+1)%cardWords.length;renderCard()}
function pool(){const p=$('#quizPage').value;return words.filter(w=>!p||w['頁碼'].split('-').includes(p))}
function weightedPick(arr){const weighted=arr.flatMap(w=>Array(Math.max(1,1+state(w.word).wrong*2)).fill(w));return weighted[Math.floor(Math.random()*weighted.length)]}
function newQuiz(){const arr=pool();if(!arr.length)return;quizWord=weightedPick(arr);quizAnswered=false;$('#feedback').textContent='';$('#choices').innerHTML='';$('#spellInput').value='';const type=$('#quizType').value;$('#spellForm').classList.toggle('hidden',type!=='spell');$('#speakQuiz').classList.toggle('hidden',type==='zh-en');if(type==='en-zh'){question.textContent=quizWord.word;makeChoices('中文')}else if(type==='zh-en'){question.textContent=quizWord['中文'];makeChoices('word')}else{question.textContent=quizWord['中文'];$('#spellInput').focus()}renderQuizStats()}
function makeChoices(field){let opts=[quizWord];const arr=pool().filter(w=>w.word!==quizWord.word).sort(()=>Math.random()-.5);opts.push(...arr.slice(0,3));opts.sort(()=>Math.random()-.5);$('#choices').innerHTML=opts.map(w=>`<button data-answer="${w.word}">${w[field]}</button>`).join('')}
function answer(ok,shown){if(quizAnswered)return;quizAnswered=true;const s=state(quizWord.word);progress[quizWord.word]={...s,right:s.right+(ok?1:0),wrong:s.wrong+(ok?0:1)};localStorage.setItem(KEY,JSON.stringify(progress));$('#feedback').textContent=ok?'答對了！':`答錯了。正確答案：${quizWord.word} — ${quizWord['中文']}`;if(shown){$$('#choices button').forEach(b=>{if(b.dataset.answer===quizWord.word)b.classList.add('correct');else if(b===shown)b.classList.add('wrong')})}renderAll()}
function renderQuizStats(){const total=Object.values(progress).reduce((a,s)=>a+s.right+s.wrong,0),right=Object.values(progress).reduce((a,s)=>a+s.right,0);$('#quizStats').textContent=`作答 ${total} 題｜答對 ${right} 題｜正確率 ${total?Math.round(right/total*100):0}%`}
function renderMistakes(){const m=words.filter(w=>state(w.word).wrong>0).sort((a,b)=>state(b.word).wrong-state(a.word).wrong);$('#mistakeList').innerHTML=m.length?m.map(w=>`<div class="word-row"><div><div class="word">${w.word}</div><div>${w['中文']}</div><div class="meta">答錯 ${state(w.word).wrong} 次・答對 ${state(w.word).right} 次</div></div><button class="small speak" data-word="${w.word}">🔊</button></div>`).join(''):'目前沒有錯題。'}
function report(w){const note=prompt(`請描述「${w.word}」哪裡需要修正：`);if(!note)return;reports.push({word:w.word,page:w['頁碼'],note,createdAt:new Date().toISOString()});localStorage.setItem(REPORT_KEY,JSON.stringify(reports));renderReports();alert('已保存在此裝置的資料驗證紀錄。')}
function renderReports(){$('#reportOutput').textContent=reports.length?JSON.stringify(reports,null,2):'尚無驗證紀錄。'}
function renderAll(){renderList();renderMistakes();renderQuizStats();renderReports()}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){$$('.tabs button').forEach(b=>b.classList.toggle('active',b===tab));$$('.tab').forEach(s=>s.classList.toggle('hidden',s.id!==tab.dataset.tab));if(tab.dataset.tab==='cards')updateCards()}const sp=e.target.closest('.speak');if(sp)speak(sp.dataset.word);const rb=e.target.closest('.report-btn');if(rb)report(words.find(w=>w.word===rb.dataset.word));const choice=e.target.closest('#choices button');if(choice)answer(choice.dataset.answer===quizWord.word,choice)});
['search','pageFilter','posFilter','levelFilter'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',renderList));
['cardPage','cardLevel'].forEach(id=>$('#'+id).addEventListener('change',updateCards));
$('#card').onclick=()=>$('#card').classList.toggle('flipped');$('#speakCard').onclick=e=>{e.stopPropagation();if(cardWords[cardIndex])speak(cardWords[cardIndex].word)};$('#prevCard').onclick=()=>{cardIndex=(cardIndex-1+cardWords.length)%cardWords.length;renderCard()};$('#nextCard').onclick=()=>{cardIndex=(cardIndex+1)%cardWords.length;renderCard()};$$('[data-rate]').forEach(b=>b.onclick=()=>setLevel(b.dataset.rate));
$('#newQuiz').onclick=newQuiz;$('#quizType').onchange=newQuiz;$('#quizPage').onchange=newQuiz;$('#speakQuiz').onclick=()=>quizWord&&speak(quizWord.word);$('#spellForm').onsubmit=e=>{e.preventDefault();answer($('#spellInput').value.trim().toLowerCase()===quizWord.word.toLowerCase())};
$('#copyReports').onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(reports,null,2));alert('已複製驗證紀錄。')};$('#clearReports').onclick=()=>{if(confirm('確定清除所有驗證紀錄？')){reports=[];localStorage.removeItem(REPORT_KEY);renderReports()}};
fetch(DATA_URL).then(r=>{if(!r.ok)throw Error('讀取資料失敗');return r.text()}).then(t=>{words=csv(t).map(w=>({...w,pos:inferPOS(w.word,w['中文'])}));fillSelects();renderAll();updateCards();newQuiz()}).catch(e=>{$('#wordList').textContent=e.message});
</script>
</body>
</html>
