<body>
<header class="top"><div class="topbar"><div class="brand">10000 Vocabulary</div><div id="reviewBadge" class="badge">不熟／錯題 0</div></div></header>
<main id="app" class="wrap"><section class="panel">載入中…</section></main>
<nav class="bottom"><a href="#/" data-nav="home">首頁</a><a href="#/words" data-nav="words">單字</a><a href="#/practice" data-nav="practice">練習</a><a href="#/review" data-nav="review">總複習</a><a href="#/clear" data-nav="clear">清除</a></nav>
<script>
'use strict';
const DATA=['data/vocabulary-pages-12-15.csv?v=20260810','data/vocabulary-pages-24-31.csv?v=20260810','data/vocabulary-pages-32-37.csv?v=20260810'];
const app=document.querySelector('#app');let words=[],session=null,cardState={i:0,filtered:[]};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))},del(k){localStorage.removeItem(k)}};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseCsv(t){const rows=[];let r=[],v='',q=false;for(let i=0;i<t.length;i++){const c=t[i],n=t[i+1];if(c==='"'&&q&&n==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){r.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;r.push(v);if(r.some(x=>x!==''))rows.push(r);r=[];v=''}else v+=c}if(v||r.length){r.push(v);rows.push(r)}const h=rows.shift().map(x=>x.replace(/^\uFEFF/,'').trim());return rows.map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]??'').trim()]))) }
function normalize(r){return{word:r.word||'',part_of_speech:r.part_of_speech||'待確認',example:r.example||'',example_zh:r.example_zh||'',chinese:r.chinese||'',synonyms:r.synonyms||'',antonyms:r.antonyms||'',memory_hint:r.memory_hint||'',page:r.page||'',page_end:r.page_end||'',difficulty:r.difficulty||''}}
const pages=w=>[w.page].filter(Boolean),pageText=w=>w.page_end?`${w.page}–${w.page_end}`:w.page||'—';
const availablePages=()=>[...new Set(words.map(w=>Number(w.page)).filter(Boolean))].sort((a,b)=>a-b);
const rangeFor=p=>`${Math.floor((Number(p)-1)/10)*10+1}-${Math.floor((Number(p)-1)/10)*10+10}`;
const ranges=()=>[...new Set(availablePages().map(rangeFor))].sort((a,b)=>+a.split('-')[0]-+b.split('-')[0]);
const pagesInRange=r=>{if(!r)return availablePages();const [a,b]=r.split('-').map(Number);return availablePages().filter(p=>p>=a&&p<=b)};
function rangeOptions(selected=''){return `<option value="">全部區間</option>${ranges().map(r=>`<option value="${r}" ${r===selected?'selected':''}>${r}</option>`).join('')}`}
function pageOptions(range,selected='',label='全部頁碼'){return `<option value="">${label}</option>${pagesInRange(range).map(p=>`<option value="${p}" ${String(p)===String(selected)?'selected':''}>第 ${p} 頁</option>`).join('')}`}
function stars(n){const x=Math.max(0,Math.min(5,Number(n)||0));return `${'★'.repeat(x)}${'☆'.repeat(5-x)}（${x}/5）`}
function speak(text){const value=String(text||'').trim();if(!value||value==='—')return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(value.replace(/;/g,', '));u.lang='en-US';speechSynthesis.speak(u)}
function hardSet(){return new Set(store.get('reviewWords',[]))}function saveHard(s){store.set('reviewWords',[...s]);updateBadge()}function updateBadge(){const e=$('#reviewBadge');if(e)e.textContent=`不熟／錯題 ${hardSet().size}`}function toggleHard(word,rerender=true){const s=hardSet();s.has(word)?s.delete(word):s.add(word);saveHard(s);if(rerender)route()}
function nav(active){$$('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===active))}function setRecentPage(p){if(p){store.set('recentPage',String(p));store.set('recentRange',rangeFor(p))}}
function bindTwoLevel(prefix,allowAll=true){const r=$('#'+prefix+'Range'),p=$('#'+prefix+'Page');r.onchange=()=>{p.innerHTML=pageOptions(r.value,'',allowAll?'全部頁碼':'請選頁碼')}}
function home(){nav('home');const result=store.get('lastResult',null),recent=store.get('recentPage',''),done=new Set(store.get('completedPages',[])),r=recent?rangeFor(recent):(ranges()[0]||'');app.innerHTML=`<section class="hero"><div class="panel"><h1>今天從哪一頁開始？</h1><p class="muted">一頁一頁學：先看單字卡，再做該頁練習；答錯或標記不熟的單字會進入歷史錯題。</p>${recent?`<div class="actions"><a href="#/cards?page=${esc(recent)}"><button class="btn">繼續第 ${esc(recent)} 頁</button></a><a href="#/practice?page=${esc(recent)}"><button class="btn secondary">練習第 ${esc(recent)} 頁</button></a></div>`:''}<hr style="border:0;border-top:1px solid #e4ecea;margin:16px 0"><h3>選擇頁碼學習</h3><div class="selector"><select id="homeRange">${rangeOptions(r)}</select><select id="homePage">${pageOptions(r,recent,'請選頁碼')}</select></div><div class="actions" style="margin-top:10px"><button id="startPage" class="btn">開始本頁單字卡</button></div></div><div class="stats"><div class="stat"><span>單字總數</span><b>${words.length}</b></div><div class="stat"><span>歷史錯題／不熟</span><b>${hardSet().size}</b></div><div class="stat"><span>已完成頁數</span><b>${done.size}</b></div><div class="stat"><span>上次正確率</span><b>${result?result.rate+'%':'—'}</b></div></div></section>`;bindTwoLevel('home',false);$('#startPage').onclick=()=>{const p=$('#homePage').value;if(!p)return alert('請先選擇頁碼');setRecentPage(p);location.hash=`#/cards?page=${p}`}}
function wordsPage(){nav('words');const mode=store.get('wordMode','both'),savedPage=store.get('wordPage',''),savedRange=store.get('wordRange',savedPage?rangeFor(savedPage):(ranges()[0]||''));app.innerHTML=`<div class="route-title"><h2>單字列表</h2><span class="muted">搜尋、篩選、發音，或手動標記不熟</span></div><section class="panel toolbar"><input id="q" placeholder="搜尋英文、中文或例句"><select id="wordRange">${rangeOptions(savedRange)}</select><select id="wordPage">${pageOptions(savedRange,savedPage)}</select><select id="pos"><option value="">全部詞性</option>${[...new Set(words.map(w=>w.part_of_speech))].sort().map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('')}</select><select id="mode"><option value="both">中英並列</option><option value="en">只看英文</option><option value="zh">只看中文</option></select></section><div id="wordList" class="word-list"></div>`;$('#mode').value=mode;$('#q').oninput=renderWords;$('#wordRange').onchange=()=>{$('#wordPage').innerHTML=pageOptions($('#wordRange').value,'');store.set('wordRange',$('#wordRange').value);store.set('wordPage','');renderWords()};$('#wordPage').onchange=()=>{store.set('wordPage',$('#wordPage').value);renderWords()};$('#pos').onchange=renderWords;$('#mode').onchange=()=>{store.set('wordMode',$('#mode').value);renderWords()};renderWords()}
function renderWords(){const q=$('#q').value.trim().toLowerCase(),p=$('#wordPage').value,pos=$('#pos').value,m=$('#mode').value,s=hardSet();const list=words.filter(w=>(!q||[w.word,w.chinese,w.example,w.example_zh].join(' ').toLowerCase().includes(q))&&(!p||pages(w).includes(p))&&(!pos||w.part_of_speech===pos));$('#wordList').innerHTML=list.map(w=>`<article class="word-item"><div class="word-main"><div class="word-en ${m==='zh'?'hidden':''}">${esc(w.word)}</div><div class="pos">${esc(w.part_of_speech)}</div><div class="word-zh ${m==='en'?'hidden':''}">${esc(w.chinese||'—')}</div><div class="meta">頁碼 ${pageText(w)}｜難度 ${esc(w.difficulty)}/5</div>${m!=='both'?`<button class="icon-btn reveal" data-word="${esc(w.word)}">顯示${m==='en'?'中文':'英文'}</button>`:''}</div><div class="word-actions"><button class="icon-btn say" data-word="${esc(w.word)}">🔊</button><button class="icon-btn hard ${s.has(w.word)?'review-on':''}" data-word="${esc(w.word)}">${s.has(w.word)?'✓ 已標記不熟':'＋ 標記不熟'}</button></div></article>`).join('')||'<section class="panel">沒有符合條件的單字。</section>';$$('.say').forEach(b=>b.onclick=()=>speak(b.dataset.word));$$('.hard').forEach(b=>b.onclick=()=>toggleHard(b.dataset.word));$$('.reveal').forEach(b=>b.onclick=()=>{const w=words.find(x=>x.word===b.dataset.word);b.textContent=m==='en'?(w?.chinese||'—'):(w?.word||'—')})}
function hashParam(name){return new URLSearchParams((location.hash.split('?')[1]||'')).get(name)||''}
function cards(){nav('words');const requested=hashParam('page')||store.get('recentPage',''),range=requested?rangeFor(requested):(ranges()[0]||'');cardState.filtered=requested?words.filter(w=>pages(w).includes(requested)):[];cardState.i=0;if(requested)setRecentPage(requested);app.innerHTML=`<div class="route-title"><h2>本頁單字卡</h2><span id="cardCount"></span></div><section class="panel card-filter"><select id="cardRange">${rangeOptions(range)}</select><select id="cardPage">${pageOptions(range,requested,'請選頁碼')}</select><button id="cardHard" class="small">＋ 標記不熟</button><button id="practicePage" class="primary">練習本頁</button></section><div class="card-wrap"><div id="flashcard" class="flashcard"><article class="face front"><div class="word-line"><div id="frontWord" class="front-word"></div><button id="speakFront" class="speak">🔊</button></div><div id="frontPos" class="pos"></div><p class="meta">點卡片空白處翻面</p></article><article class="face back"><div class="back-head"><div><h2 id="backWord"></h2><div id="backPos" class="pos"></div></div><button id="speakBack" class="speak">🔊</button></div><div class="field"><span class="label">中文</span><div id="backZh"></div></div><div class="field"><div class="label-row"><span class="label">課本例句</span><button id="speakExample" class="speak-mini">🔊 發音</button></div><div id="backExample" class="example"></div><div id="backExampleZh" class="example-zh"></div></div><div class="field"><div class="label-row"><span class="label">同義字</span><button id="speakSyn" class="speak-mini">🔊 發音</button></div><div id="backSyn" class="syn"></div></div><div class="field"><div class="label-row"><span class="label">反義字</span><button id="speakAnt" class="speak-mini">🔊 發音</button></div><div id="backAnt" class="ant"></div></div><div class="field memory"><span class="label">記憶提示</span><div id="backMemory"></div></div><div class="compact-meta"><div class="field"><span class="label">頁碼</span><div id="backPage"></div></div><div class="field"><span class="label">難度</span><div id="backDifficulty" class="stars"></div></div></div></article></div></div><div class="card-nav"><button id="prev" class="small">上一張</button><button id="flip" class="small">翻面</button><button id="next" class="primary">下一張</button></div>`;$('#cardRange').onchange=()=>{$('#cardPage').innerHTML=pageOptions($('#cardRange').value,'','請選頁碼');cardState.filtered=[];cardState.i=0;renderCard()};$('#cardPage').onchange=()=>{const p=$('#cardPage').value;cardState.filtered=p?words.filter(w=>pages(w).includes(p)):[];cardState.i=0;if(p)setRecentPage(p);renderCard()};$('#practicePage').onclick=()=>{const p=$('#cardPage').value;if(!p)return alert('請先選擇頁碼');setRecentPage(p);location.hash=`#/practice?page=${p}`};$('#prev').onclick=()=>moveCard(-1);$('#next').onclick=()=>moveCard(1);$('#flip').onclick=flipCard;$('#flashcard').onclick=e=>{if(!e.target.closest('button'))flipCard()};['speakFront','speakBack','speakExample','speakSyn','speakAnt'].forEach(id=>$('#'+id).onclick=e=>{e.stopPropagation();const w=cardState.filtered[cardState.i];if(!w)return;speak(id==='speakExample'?w.example:id==='speakSyn'?w.synonyms:id==='speakAnt'?w.antonyms:w.word)});$('#cardHard').onclick=()=>{const w=cardState.filtered[cardState.i];if(w){toggleHard(w.word,false);renderCard()}};renderCard()}
function renderCard(){const w=cardState.filtered[cardState.i];$('#flashcard').classList.remove('flipped');if(!w){$('#frontWord').textContent='請先選擇頁碼';$('#frontPos').textContent='';$('#cardCount').textContent='0/0';$('#cardHard').disabled=true;return}$('#cardHard').disabled=false;$('#cardCount').textContent=`${cardState.i+1}/${cardState.filtered.length}`;$('#frontWord').textContent=$('#backWord').textContent=w.word;$('#frontPos').textContent=$('#backPos').textContent=w.part_of_speech;$('#backZh').textContent=w.chinese||'—';$('#backExample').textContent=w.example||'—';$('#backExampleZh').textContent=w.example_zh||'—';$('#backSyn').textContent=w.synonyms||'—';$('#backAnt').textContent=w.antonyms||'—';$('#backMemory').textContent=w.memory_hint||'—';$('#backPage').textContent=pageText(w);$('#backDifficulty').textContent=stars(w.difficulty);const on=hardSet().has(w.word);$('#cardHard').textContent=on?'✓ 已標記不熟':'＋ 標記不熟';$('#cardHard').classList.toggle('review-on',on)}function moveCard(n){if(!cardState.filtered.length)return;cardState.i=(cardState.i+n+cardState.filtered.length)%cardState.filtered.length;renderCard()}function flipCard(){if(cardState.filtered.length)$('#flashcard').classList.toggle('flipped')}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function makeQuestions(pool,count){return shuffle(pool).slice(0,Math.min(count,pool.length)).map((w,i)=>{const type=i%4;let prompt,answer,others;if(type===0){prompt=w.word;answer=w.chinese;others=words.filter(x=>x.word!==w.word).map(x=>x.chinese)}else if(type===1){prompt=w.chinese;answer=w.word;others=words.filter(x=>x.word!==w.word).map(x=>x.word)}else if(type===2){prompt=w.example.replace(new RegExp(w.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),'________');answer=w.word;others=words.filter(x=>x.word!==w.word).map(x=>x.word)}else{prompt=`哪一個是「${w.chinese}」的正確單字？`;answer=w.word;others=words.filter(x=>x.part_of_speech===w.part_of_speech&&x.word!==w.word).map(x=>x.word)}return{w,type,prompt,answer,choices:shuffle([answer,...shuffle([...new Set(others.filter(Boolean))]).slice(0,3)])}})}
function practiceLanding(){nav('practice');const recent=store.get('recentPage',''),r=recent?rangeFor(recent):(ranges()[0]||'');app.innerHTML=`<div class="route-title"><h2>練習</h2><span class="muted">目前先做單頁練習；多頁複習稍後再加入</span></div><section class="panel"><h3>選擇本頁練習</h3><div class="selector"><select id="practiceRange">${rangeOptions(r)}</select><select id="practicePage">${pageOptions(r,recent,'請選頁碼')}</select></div><div class="actions" style="margin-top:10px"><button id="startPractice" class="btn">開始本頁練習</button></div></section>`;bindTwoLevel('practice',false);$('#startPractice').onclick=()=>{const p=$('#practicePage').value;if(!p)return alert('請先選擇頁碼');setRecentPage(p);startPractice('page',p,'all')}}
function startPractice(mode='page',page='',count='all'){let pool=mode==='page'?words.filter(w=>pages(w).includes(String(page))):mode==='history'?[...hardSet()].map(x=>words.find(w=>w.word===x)).filter(Boolean):words;if(!pool.length){app.innerHTML='<section class="panel"><h2>目前沒有可練習的單字</h2></section>';return}const n=count==='all'?pool.length:Number(count)||pool.length;session={mode,page:String(page||''),qs:makeQuestions(pool,n),i:0,right:0,wrong:[],answered:false};renderQuestion()}
function renderQuestion(){nav(session.mode==='page'?'practice':'review');const q=session.qs[session.i];if(!q)return finish();const title=session.mode==='page'?`第 ${session.page} 頁練習`:session.mode==='history'?'歷史錯題抽考':'全部單字抽考';app.innerHTML=`<div class="route-title"><h2>${title}</h2><span>${session.i+1}/${session.qs.length}</span></div><div class="progress"><span style="width:${session.i/session.qs.length*100}%"></span></div><section class="panel"><div class="muted">${['英翻中','中翻英','例句選字','易混淆題'][q.type]}</div><div class="question">${esc(q.prompt)}</div><div class="choices">${q.choices.map(c=>`<button class="choice" data-choice="${esc(c)}">${esc(c)}</button>`).join('')}</div><div id="feedback"></div></section>`;$$('.choice').forEach(b=>b.onclick=()=>answer(b,q))}
function answer(btn,q){if(session.answered)return;session.answered=true;const ok=btn.dataset.choice===q.answer;$$('.choice').forEach(b=>{b.disabled=true;if(b.dataset.choice===q.answer)b.classList.add('correct')});if(ok)session.right++;else{btn.classList.add('wrong');session.wrong.push(q.w.word);const s=hardSet();s.add(q.w.word);saveHard(s)}$('#feedback').innerHTML=`<div class="feedback"><b>${ok?'✅ 答對':'❌ 答錯'}</b><p>正確答案：${esc(q.answer)}</p><p>${esc(q.w.word)}｜${esc(q.w.part_of_speech)}｜${esc(q.w.chinese)}</p><p>${esc(q.w.example)}</p>${ok?'<button id="stillHard" class="btn ghost">仍不熟，標記不熟</button>':'<span class="muted">已記入歷史錯題／不熟清單</span>'}<button id="continue" class="btn">下一題</button></div>`;if($('#stillHard'))$('#stillHard').onclick=()=>{const s=hardSet();s.add(q.w.word);saveHard(s);$('#stillHard').textContent='✓ 已標記'};$('#continue').onclick=()=>{session.i++;session.answered=false;renderQuestion()}}
function finish(){const result={mode:session.mode,page:session.page,total:session.qs.length,right:session.right,wrong:[...new Set(session.wrong)],rate:Math.round(session.right/session.qs.length*100)};if(session.mode==='page'){store.set('lastResult',result);const done=new Set(store.get('completedPages',[]));done.add(session.page);store.set('completedPages',[...done]);setRecentPage(session.page)}else store.set('lastReviewResult',result);location.hash=session.mode==='page'?'#/practice/result':'#/review/result'}
function resultPage(pageMode){nav(pageMode?'practice':'review');const r=store.get(pageMode?'lastResult':'lastReviewResult',null);app.innerHTML=`<section class="panel"><h2>${pageMode&&r?.page?`第 ${esc(r.page)} 頁練習結果`:'總複習結果'}</h2>${r?`<div class="stats"><div class="stat"><span>總題數</span><b>${r.total}</b></div><div class="stat"><span>答對</span><b>${r.right}</b></div><div class="stat"><span>正確率</span><b>${r.rate}%</b></div><div class="stat"><span>本次答錯</span><b>${r.wrong.length}</b></div></div><p>本次需再加強：${r.wrong.length?r.wrong.map(esc).join('、'):'無'}</p>`:'<p>尚無結果。</p>'}<div class="actions"><a href="#/"><button class="btn secondary">回首頁</button></a><a href="${pageMode?'#/practice':'#/review'}"><button class="btn">繼續</button></a></div></section>`}
function reviewPage(){nav('review');app.innerHTML=`<div class="route-title"><h2>總複習</h2><span class="muted">兩種亂數抽考模式</span></div><div class="mode-grid"><section class="mode-card"><span class="pill">${hardSet().size} 個</span><h3>歷史錯題／不熟</h3><p class="muted">從曾經答錯或手動標記不熟的單字中亂數出題。</p><div class="quick-actions"><button class="btn historyCount" data-count="10">10 題</button><button class="btn secondary historyCount" data-count="20">20 題</button><button class="btn secondary historyCount" data-count="all">全部</button></div></section><section class="mode-card"><span class="pill">${words.length} 個</span><h3>全部單字抽考</h3><p class="muted">不看頁碼，從目前所有單字中隨機抽題。</p><div class="quick-actions"><button class="btn allCount" data-count="10">10 題</button><button class="btn secondary allCount" data-count="20">20 題</button><button class="btn secondary allCount" data-count="30">30 題</button><button class="btn secondary allCount" data-count="50">50 題</button><button class="btn secondary allCount" data-count="all">全部</button></div></section></div>`;$$('.historyCount').forEach(b=>b.onclick=()=>startPractice('history','',b.dataset.count));$$('.allCount').forEach(b=>b.onclick=()=>startPractice('all','',b.dataset.count))}
function clearPage(){nav('clear');const done=store.get('completedPages',[]),last=store.get('lastResult',null);app.innerHTML=`<div class="route-title"><h2>清除本機資料</h2><span class="muted">只影響這台裝置；GitHub 單字資料不會被刪除</span></div><section class="panel"><div class="stats"><div class="stat"><span>歷史錯題／不熟</span><b>${hardSet().size}</b></div><div class="stat"><span>已完成頁數</span><b>${done.length}</b></div><div class="stat"><span>最近正確率</span><b>${last?last.rate+'%':'—'}</b></div><div class="stat"><span>目前單字</span><b>${words.length}</b></div></div></section><div class="clear-grid"><section class="clear-card"><h3>清除歷史錯題</h3><p class="muted">只清除答錯與手動標記不熟的清單。</p><button id="clearWrong" class="btn secondary">清除歷史錯題</button></section><section class="clear-card"><h3>清除學習進度</h3><p class="muted">清除錯題、完成頁碼、最近頁碼與練習成績；保留顯示偏好。</p><button id="clearProgress" class="btn secondary">清除學習進度</button></section><section class="clear-card"><h3>清除全部本機資料</h3><p class="muted">清空本網站在此瀏覽器的所有 localStorage 記錄，無法復原。</p><button id="clearAll" class="btn danger">清除全部本機資料</button></section></div>`;$('#clearWrong').onclick=()=>{if(confirm('確定清除所有歷史錯題／不熟標記？此動作無法復原。')){store.del('reviewWords');clearPage()}};$('#clearProgress').onclick=()=>{if(confirm('確定清除學習進度？此動作無法復原。')){['reviewWords','completedPages','recentPage','recentRange','lastResult','lastReviewResult'].forEach(k=>store.del(k));clearPage()}};$('#clearAll').onclick=()=>{if(confirm('確定清除這台裝置上的全部本機資料？此動作無法復原。')){localStorage.clear();clearPage()}}}
function route(){if(!words.length)return;const h=(location.hash||'#/').split('?')[0];if(h==='#/'||h==='#')home();else if(h==='#/words')wordsPage();else if(h==='#/cards')cards();else if(h==='#/practice/result')resultPage(true);else if(h==='#/practice'){const p=hashParam('page');p?startPractice('page',p,'all'):practiceLanding()}else if(h==='#/review/result')resultPage(false);else if(h==='#/review')reviewPage();else if(h==='#/clear')clearPage();else home();updateBadge()}
window.addEventListener('hashchange',route);Promise.all(DATA.map(url=>fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`${url}: HTTP ${r.status}`);return r.text()}))).then(parts=>{const seen=new Set();words=parts.flatMap(t=>parseCsv(t).map(normalize)).filter(w=>{if(!w.word)return false;const key=`${w.word}|${w.page}`;if(seen.has(key))return false;seen.add(key);return true});updateBadge();route()}).catch(err=>{app.innerHTML=`<section class="panel">資料載入失敗：${esc(err.message)}</section>`});
</script>
</body>
</html>
